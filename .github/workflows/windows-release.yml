name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify source
        run: |
          node --check electron/main.js
          node --check public/app.js
          node --check public/terminal-scroll.js
          node tests/terminal-output.js
          node tests/theme-menu-state.js
          node tests/startup-single-instance.js
          node tests/ssh-zmodem.js
          npm test
      - name: Verify CLI and WeCom interactions
        shell: pwsh
        run: |
          $tests = @('asar-integrity', 'markdown-math', 'clipboard-text', 'mcp-manager', 'pet-input-recovery', 'pet-window-recovery', 'remote-store-recovery', 'cli-sequential-questions', 'cli-native-delivery', 'cli-native-interaction', 'cli-wecom-native-roundtrip', 'cli-session', 'cli-interactions', 'cli-result-channel', 'cli-wecom-approval', 'cli-trust', 'cli-permission', 'cli-progress', 'wecom-service', 'wecom-files')
          foreach ($test in $tests) {
            node "tests/$test.js"
            if ($LASTEXITCODE -ne 0) { throw "Interaction test failed: $test" }
          }
      - name: Verify software MCP management
        run: node tests/mcp-ui.js
      - name: Package Windows app
        shell: pwsh
        run: |
          npm run dist:win -- --dir --config.electronDist=node_modules/electron/dist --config.win.signAndEditExecutable=false
          if (!(Test-Path dist/win-unpacked/resources/app.asar) -or !(Test-Path dist/win-unpacked/fanbox-pro.exe)) { throw 'Windows app packaging failed' }
          node scripts/finalize-win.js dist/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Executable resources failed' }
          npm run dist:win -- --prepackaged dist/win-unpacked --config.win.signAndEditExecutable=false
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify packaged app
        run: node tests/appearance-clipboard-smoke.js dist/win-unpacked/fanbox-pro.exe
      - name: Verify file scrolling
        run: node tests/file-scroll-smoke.js dist/win-unpacked/fanbox-pro.exe
      - name: Verify interactive HTML preview
        run: node tests/html-preview-smoke.js dist/win-unpacked/fanbox-pro.exe
      - name: Verify terminal history and colours
        run: node tests/terminal-scroll-color-smoke.js dist/win-unpacked/fanbox-pro.exe
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanbox-pro-windows-${{ env.RELEASE_VERSION }}
          path: dist/fanbox-pro-*-x64.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "dist/fanbox-pro-$env:RELEASE_VERSION-x64.exe"
          if (!(Test-Path $installer)) { throw 'Installer not found' }
          node scripts/release-notes.js dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --notes-file dist/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
            gh release upload $env:GITHUB_REF_NAME $installer --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer --repo $env:GITHUB_REPOSITORY --verify-tag --title "fanbox-pro $env:RELEASE_VERSION (Windows)" --notes-file dist/release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
