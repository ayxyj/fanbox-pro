const pages=[{"title":"fanbox-pro 用户指南","file":"README.md","text":"# fanbox-pro 用户指南\r\n\r\n**适用版本：Windows 1.0.1 · 文档更新：2026-10-21**\r\n\r\nfanbox-pro 将本地文件、终端、SSH、AI 对话、企业微信远程操作和 Git 管理放在同一个工作界面中。本指南按“先配置，再操作，再排查”的顺序说明如何使用。\r\n\r\n![主界面：左侧导航、上方路径与视图、右侧文件区](assets/01-workspace.png)\r\n\r\n*图 1：真实应用界面，使用独立演示目录。后文截图中的地址、模型和对话是测试示例，不是可直接连接的线上服务。*\r\n\r\n## 从哪里开始\r\n\r\n| 我想做什么 | 阅读章节 |\r\n| --- | --- |\r\n| 安装后第一次使用 | [安装与快速开始](getting-started.md) |\r\n| 浏览、搜索、预览或编辑文件 | [文件与编辑器](files.md) |\r\n| 打开本地终端、运行 CLI | [终端与 CLI](terminal.md) |\r\n| 登录服务器、管理远程文件 | [SSH 与快捷命令](ssh.md)、[远程文件](remote-files.md) |\r\n| 配置模型，让 AI 操作终端 | [AI 配置](ai-settings.md)、[AI 对话](ai-chat.md) |\r\n| 在企业微信中远程下发任务 | [绑定企业微信](wecom-setup.md)、[远程交互](wecom-commands.md) |\r\n| Git 同步和定时执行 | [Git 管理](git.md)、[定时任务](schedules.md) |\r\n| 设置主题、宠物或排查问题 | [外观与宠物](appearance.md)、[故障排查](troubleshooting.md) |\r\n\r\n## 先理解三个概念\r\n\r\n**终端**是命令真正执行的地方，本地终端运行 CMD / PowerShell，SSH 终端连接服务器。\r\n\r\n**内置 AI 对话**使用“设置 → AI 配置”中启用的模型，通过当前会话绑定的终端执行命令。它与 Claude、Codex、CodeBuddy CLI 自己的聊天上下文相互独立。\r\n\r\n**企业微信桥接会话**属于某个已绑定的企微账号，指向一个本地终端。消息可以交给内置 AI，也可以原样转交该终端里的 CLI。它不是左侧 SSH 会话管理的另一种展示方式。\r\n\r\n## 阅读约定\r\n\r\n- `设置 → AI 配置` 表示按顺序打开菜单。\r\n- 所有示例路径需要替换为自己的实际路径；`192.0.2.10` 是示例地址。\r\n- 截图中的本机模型地址是截图专用测试服务；不要照抄为生产配置。\r\n- 文档包含步骤、预期结果和异常处理。没有真实企微账号联调截图的部分使用文字示例，不伪造微信聊天界面。\r\n- 本地浏览文件不需要模型；AI 请求及获准的命令结果会发送到所配置的模型服务，企微消息和附件会经企业微信发送。\r\n\r\n完整目录见 [SUMMARY.md](SUMMARY.md)。\r\n","html":"\u003ch1>fanbox-pro 用户指南\u003c/h1>\n\u003cp>\u003cstrong>适用版本：Windows 1.0.1 · 文档更新：2026-10-21\u003c/strong>\u003c/p>\n\u003cp>fanbox-pro 将本地文件、终端、SSH、AI 对话、企业微信远程操作和 Git 管理放在同一个工作界面中。本指南按“先配置，再操作，再排查”的顺序说明如何使用。\u003c/p>\n\u003cp>\u003cimg src=\"assets/01-workspace.png\" alt=\"主界面：左侧导航、上方路径与视图、右侧文件区\">\u003c/p>\n\u003cp>\u003cem>图 1：真实应用界面，使用独立演示目录。后文截图中的地址、模型和对话是测试示例，不是可直接连接的线上服务。\u003c/em>\u003c/p>\n\u003ch2>从哪里开始\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>我想做什么\u003c/th>\n\u003cth>阅读章节\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctb u003c/ul>\n\u003cp>完整目录见 \u003ca href=\"SUMMARY.md\">SUMMARY.md\u003c/a>。\u003c/p>\n"},{"title":"安装与快速开始","file":"getting-started.md","text":"# 安装与快速开始\r\n\r\n## 1. 安装或运行\r\n\r\n安装版文件名形如 `fanbox-pro-1.0.1-x64.exe`。双击后按安装向导选择安装目录，安装完成后从桌面快捷方式启动。\r\n\r\n如果使用 `win-unpacked`，保留整个文件夹并运行其中的 `fanbox-pro.exe`。不要只复制 exe，旁边的资源和依赖文件也是运行所必需的。\r\n\r\n更新前保存正在编辑的文件，并结束不需要保留的终端任务。退出旧版后再启动新版，避免后台旧实例让你看到的仍是旧界面。关闭终端或退出软件可能中断 SSH / CLI 会话。\r\n\r\n## 2. 认识工作界面\r\n\r\n![工作界面与目录树](assets/01-workspace.png)\r\n\r\n*左侧负责导航，上方显示路径和视图切换，中间是文件区域。*\r\n\r\n| 区域 | 操作 |\r\n| --- | --- |\r\n| 左上角菜单 | 文件、编辑、视图、设置；AI 和 IM 配置位于设置中 |\r\n| 快速入口 | 打开主目录、桌面、文档、下载等路径 |\r\n| 一级菜单左侧三角 | 展开 / 折叠该模块；默认仅快速入口展开 |\r\n| 路径导航 | 点击上级路径段返回对应目录 |\r\n| 右上角视图按钮 | 切换目录树、网格、列表；后续启动沿用用户选择 |\r\n| 终端按钮 | 在当前目录打开本地终端 |\r\n| 文件区 / 预览区分隔线 | 拖动调整显示宽度 |\r\n\r\n## 3. 完成第一次本地操作\r\n\r\n1. 从快速入口找到一个测试项目目录。\r\n2. 切到目录树，展开文件夹，点击一个文本文件。\r\n3. 在编辑器中修改内容，用 `Ctrl+S` 保存。\r\n4. 点击“终端”，确认提示符中的目录是目标项目。\r\n5. 在 PowerShell 输入 `Get-ChildItem`，或在 CMD 输入 `dir`。\r\n\r\n**完成标志：**文件能保存，终端列出对应目录的内容。此流程不依赖 SSH、模型密钥或企业微信。\r\n\r\n## 4. 按需要配置扩展能力\r\n\r\n- 连接服务器：先添加 [SSH 连接](ssh.md)。\r\n- 使用内置 AI：先创建、测试并启用 [AI 配置](ai-settings.md)。\r\n- 使用 CLI：先在电脑上安装并登录相应 CLI，再从 [终端](terminal.md) 启动。\r\n- 手机远程操作：先完成 [企业微信绑定](wecom-setup.md)。\r\n\r\n## 常见启动问题\r\n\r\n启动后没有新窗口，先检查任务栏和后台是否已有实例；桌面宠物仍显示时，可以单击宠物唤出主窗口。若新版包不完整，重新解压完整文件夹后启动，不要从压缩包内直接运行。\r\n","html":"\u003ch1>安装与快速开始\u003c/h1>\n\u003ch2>1. 安装或运行\u003c/h2>\n\u003cp>安装版文件名形如 \u003ccode>fanbox-pro-1.0.1-x64.exe\u003c/code>。双击后按安装向导选择安装目录，安装完成后从桌面快捷方式启动。\u003c/p>\n\u003cp>如果使用 \u003ccode>win-unpacked\u003c/code>，保留整个文件夹并运行其中的 \u003ccode>fanbox-pro.exe\u003c/code>。不要只复制 exe，旁边的资源和依赖文件也是运行所必需的。\u003c/p>\n\u003cp>更新前保存正在编辑的文件，并结束不需要保留的终端任务。退出旧版后再启动新版，避免后台旧实例让你看到的仍是旧界面。关闭终端或退出软件可能中断 SSH / CLI 会话。\u003c/p>\n\u003ch2>2. 认识工作界面\u003c/h2>\n\u003cp>\u003cimg src=\"assets/01-workspace.png\" alt=\"工作界面与目录树\">\u003c/p>\n\u003cp>\u003cem>左侧负责导航，上方显示路径和视图切换，中间是文件区域。\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>区域\u003c/th>\n\u003cth>操作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>左上角菜单\u003c/td>\n\u003ctd>文件、编辑、视图、设置；AI 和 IM 配置位于设置中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快速入口\u003c/td>\n\u003ctd>打开主目录、桌面、文档、下载等路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一级菜单左侧三角\u003c/td>\n\u003ctd>展开 / 折叠该模块；默认仅快速入口展开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>路径导航\u003c/td>\n\u003ctd>点击上级路径段返回对应目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>右上角视图按钮\u003c/td>\n\u003ctd>切换目录树、网格、列表；后续启动沿用用户选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>终端按钮\u003c/td>\n\u003ctd>在当前目录打开本地终端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文件区 / 预览区分隔线\u003c/td>\n\u003ctd>拖动调整显示宽度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>3. 完成第一次本地操作\u003c/h2>\n\u003col>\n\u003cli>从快速入口找到一个测试项目目录。\u003c/li>\n\u003cli>切到目录树，展开文件夹，点击一个文本文件。\u003c/li>\n\u003cli>在编辑器中修改内容，用 \u003ccode>Ctrl+S\u003c/code> 保存。\u003c/li>\n\u003cli>点击“终端”，确认提示符中的目录是目标项目。\u003c/li>\n\u003cli>在 PowerShell 输入 \u003ccode>Get-ChildItem\u003c/code>，或在 CMD 输入 \u003ccode>dir\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>**完成标志：**文件能保存，终端列出对应目录的内容。此流程不依赖 SSH、模型密钥或企业微信。\u003c/p>\n\u003ch2>4. 按需要配置扩展能力\u003c/h2>\n\u003cul>\n\u003cli>连接服务器：先添加 \u003ca href=\"ssh.md\">SSH 连接\u003c/a>。\u003c/li>\n\u003cli>使用内置 AI：先创建、测试并启用 \u003ca href=\"ai-settings.md\">AI 配置\u003c/a>。\u003c/li>\n\u003cli>使用 CLI：先在电脑上安装并登录相应 CLI，再从 \u003ca href=\"terminal.md\">终端\u003c/a> 启动。\u003c/li>\n\u003cli>手机远程操作：先完成 \u003ca href=\"wecom-setup.md\">企业微信绑定\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2>常见启动问题\u003c/h2>\n\u003cp>启动后没有新窗口，先检查任务栏和后台是否已有实例；桌面宠物仍显示时，可以单击宠物唤出主窗口。若新版包不完整，重新解压完整文件夹后启动，不要从压缩包内直接运行。\u003c/p>\n"},{"title":"文件浏览、搜索、预览与编辑","file":"files.md","text":"# 文件浏览、搜索、预览与编辑\r\n\r\n## 切换目录与视图\r\n\r\n首次启动默认采用目录树，后续启动优先沿用你的视图设置。树形、网格、列表可在文件区右上角切换；排序可以选择名称、时间或大小。“隐藏文件”控制隐藏项是否显示。\r\n\r\n在目录树中，单击文件夹的展开入口查看子项，双击文件夹进入该目录。文件图标随层级缩进；窄区域优先展示文件名，时间和大小位于辅助信息区域。\r\n\r\n右键文件夹，可以找到全部展开 / 全部折叠相关操作。大目录展开需要加载目录内容，请留意进度；它不会使远程 SSH 文件树自动展开。\r\n\r\n## 查找文件\r\n\r\n1. 点击左侧“搜索全部文件”，或按 `Ctrl+K`。\r\n2. 输入文件名片段。\r\n3. 用 `Tab` 切换搜索范围，使用方向键选择结果、回车打开。\r\n4. 要搜索文件内容，可使用 `内容:关键词`，例如 `内容:quicksort`。\r\n\r\n全机搜索的可见结果受可访问目录、索引和文件权限影响。找不到结果时，先进入目标目录再缩小范围搜索。\r\n\r\n## 编辑文本与代码\r\n\r\n![代码文件默认进入编辑状态](assets/02-editor.png)\r\n\r\n*点击可编辑的代码文件后，右侧出现编辑器；标题栏提供关闭、全屏等操作。*\r\n\r\n1. 点击文本或代码文件。\r\n2. 直接在编辑器中修改内容。\r\n3. 按 `Ctrl+S` 保存，并留意保存状态或错误提示。\r\n4. 切换文件前处理未保存修改，避免误放弃。\r\n\r\n拖动预览区域边界可调整宽度。点击预览标题栏的全屏图标放大，再次点击恢复；编辑区和终端分别占据自己的区域，长文件在编辑区内滚动。\r\n\r\n## 查看 HTML、图片及其他文件\r\n\r\n![HTML 文件预览](assets/03-html-preview.png)\r\n\r\n*HTML 默认显示页面效果；图中为本地演示页面。*\r\n\r\n图片与 HTML 默认预览，不会像普通代码文件一样直接进入编辑状态。HTML 页面涉及外部网络、脚本或相对资源时，呈现效果还受这些资源是否可访问影响。需要完整开发服务器的项目，应先在终端启动项目，再按项目要求访问页面。\r\n\r\n图片可点击放大；其他支持格式按文件类型展示。无法预览时可以通过文件菜单或右键菜单使用外部程序打开。\r\n\r\n## 收藏与日常文件操作\r\n\r\n文件 / 文件夹右键菜单提供与该项目适用的操作，例如打开、重命名、复制路径、收藏等。收藏入口位于左侧，可折叠。重命名快捷键为 `F2`；执行删除前确认对象与路径。\r\n\r\n“Agent 项目”显示已发现的 Agent 项目入口；它与文件收藏、Git 工作区、SSH 分组不是同一份列表。\r\n\r\n## 文件跟随\r\n\r\n终端工具栏的“文件跟随”用于跟随当前 Agent 操作的文件，适合一边执行任务一边查看 HTML / Markdown 的变化。手动浏览会停止跟随；想固定看某个文件时，关闭跟随即可。\r\n","html":"\u003ch1>文件浏览、搜索、预览与编辑\u003c/h1>\n\u003ch2>切换目录与视图\u003c/h2>\n\u003cp>首次启动默认采用目录树，后续启动优先沿用你的视图设置。树形、网格、列表可在文件区右上角切换；排序可以选择名称、时间或大小。“隐藏文件”控制隐藏项是否显示。\u003c/p>\n\u003cp>在目录树中，单击文件夹的展开入口查看子项，双击文件夹进入该目录。文件图标随层级缩进；窄区域优先展示文件名，时间和大小位于辅助信息区域。\u003c/p>\n\u003cp>右键文件夹，可以找到全部展开 / 全部折叠相关操作。大目录展开需要加载目录内容，请留意进度；它不会使远程 SSH 文件树自动展开。\u003c/p>\n\u003ch2>查找文件\u003c/h2>\n\u003col>\n\u003cli>点击左侧“搜索全部文件”，或按 \u003ccode>Ctrl+K\u003c/code>。\u003c/li>\n\u003cli>输入文件名片段。\u003c/li>\n\u003cli>用 \u003ccode>Tab\u003c/code> 切换搜索范围，使用方向键选择结果、回车打开。\u003c/li>\n\u003cli>要搜索文件内容，可使用 \u003ccode>内容:关键词\u003c/code>，例如 \u003ccode>内容:quicksort\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cp>全机搜索的可见结果受可访问目录、索引和文件权限影响。找不到结果时，先进入目标目录再缩小范围搜索。\u003c/p>\n\u003ch2>编辑文本与代码\u003c/h2>\n\u003cp>\u003cimg src=\"assets/02-editor.png\" alt=\"代码文件默认进入编辑状态\">\u003c/p>\n\u003cp>\u003cem>点击可编辑的代码文件后，右侧出现编辑器；标题栏提供关闭、全屏等操作。\u003c/em>\u003c/p>\n\u003col>\n\u003cli>点击文本或代码文件。\u003c/li>\n\u003cli>直接在编辑器中修改内容。\u003c/li>\n\u003cli>按 \u003ccode>Ctrl+S\u003c/code> 保存，并留意保存状态或错误提示。\u003c/li>\n\u003cli>切换文件前处理未保存修改，避免误放弃。\u003c/li>\n\u003c/ol>\n\u003cp>拖动预览区域边界可调整宽度。点击预览标题栏的全屏图标放大，再次点击恢复；编辑区和终端分别占据自己的区域，长文件在编辑区内滚动。\u003c/p>\n\u003ch2>查看 HTML、图片及其他文件\u003c/h2>\n\u003cp>\u003cimg src=\"assets/03-html-preview.png\" alt=\"HTML 文件预览\">\u003c/p>\n\u003cp>\u003cem>HTML 默认显示页面效果；图中为本地演示页面。\u003c/em>\u003c/p>\n\u003cp>图片与 HTML 默认预览，不会像普通代码文件一样直接进入编辑状态。HTML 页面涉及外部网络、脚本或相对资源时，呈现效果还受这些资源是否可访问影响。需要完整开发服务器的项目，应先在终端启动项目，再按项目要求访问页面。\u003c/p>\n\u003cp>图片可点击放大；其他支持格式按文件类型展示。无法预览时可以通过文件菜单或右键菜单使用外部程序打开。\u003c/p>\n\u003ch2>收藏与日常文件操作\u003c/h2>\n\u003cp>文件 / 文件夹右键菜单提供与该项目适用的操作，例如打开、重命名、复制路径、收藏等。收藏入口位于左侧，可折叠。重命名快捷键为 \u003ccode>F2\u003c/code>；执行删除前确认对象与路径。\u003c/p>\n\u003cp>“Agent 项目”显示已发现的 Agent 项目入口；它与文件收藏、Git 工作区、SSH 分组不是同一份列表。\u003c/p>\n\u003ch2>文件跟随\u003c/h2>\n\u003cp>终端工具栏的“文件跟随”用于跟随当前 Agent 操作的文件，适合一边执行任务一边查看 HTML / Markdown 的变化。手动浏览会停止跟随；想固定看某个文件时，关闭跟随即可。\u003c/p>\n"},{"title":"本地终端与 CLI","file":"terminal.md","text":"# 本地终端与 CLI\r\n\r\n## 打开、切换和调整终端\r\n\r\n![本地终端](assets/04-terminal.png)\r\n\r\n*终端在当前项目目录启动；提示符可以确认当前 Shell 与目录。*\r\n\r\n1. 在文件区进入项目目录，点击“终端”。\r\n2. 使用 `＋` 新建终端，通过标签切换。\r\n3. 标签过多时使用左右滚动箭头或全部标签列表。\r\n4. 拖动分隔条调整大小；使用布局按钮切换上下 / 左右排列。\r\n5. 使用铺满图标放大终端，再次点击恢复。\r\n\r\n“收起终端”用于收起面板；关闭某个标签会关闭对应终端。两者不要混淆。进程退出后，界面会提示回车重开或关闭标签。\r\n\r\n“定位文件”把文件区切到当前终端目录。路径拖入终端可用于输入文件路径，提交前检查带空格路径的引用是否正确。\r\n\r\n## CMD 与 PowerShell 命令示例\r\n\r\n| 目的 | CMD | PowerShell |\r\n| --- | --- | --- |\r\n| 列出目录 | `dir` | `Get-ChildItem` |\r\n| 显示当前目录 | `cd` | `Get-Location` |\r\n| 进入项目 | `cd /d D:\\code\\demo` | `Set-Location D:\\code\\demo` |\r\n| 显示文本 | `type README.md` | `Get-Content README.md` |\r\n\r\nLinux 的 `ll` 并非 Windows 通用命令；即便在 Linux 上，它也可能只是用户自定义别名。\r\n\r\n中文输入按输入法正常选词，确认候选词后再回车提交命令。选词期间的回车不应直接提交终端命令。\r\n\r\n## 启动 Claude、Codex、CodeBuddy\r\n\r\n前提是相应 CLI 已安装、能在终端找到命令，并已完成登录或自己的模型配置。FanBox 的 AI 配置不会改写这些 CLI 的全局配置。\r\n\r\n终端工具栏提供三个 CLI 图标。空闲终端可原地启动，忙碌时可能新建标签；以实际新标签和进程提示为准。\r\n\r\n> 当前版本的本地 Claude 快捷图标使用跳过权限确认的启动参数。希望保留 Claude 默认审批时，请在终端手动输入 `claude`。企业微信 `/claude` 的桥接启动流程与此本地图标不同，仍处理信任与权限交互。\r\n\r\nClaude 底部出现 `shift+tab to cycle` 时，可使用工具栏权限图标切换模式。查看切换后的实际状态，不要把“发送按键”当作切换成功。\r\n\r\n## 手动终端与内置 AI 的区别\r\n\r\n终端键盘输入直接到 Shell / CLI。内置 AI 输入框中的文本先发送给启用的模型，由模型决定是否调用工具。已经进入 CLI 的企微会话会把普通消息原样发送给 CLI，详见 [企业微信命令](wecom-commands.md)。\r\n\r\n滚轮用于查看回滚内容，不代表重新执行命令。拖动分隔条会改变终端尺寸，CLI 可能重绘自己的界面；若发现异常重复，记录发生时是滚动还是改变尺寸，便于排查。\r\n","html":"\u003ch1>本地终端与 CLI\u003c/h1>\n\u003ch2>打开、切换和调整终端\u003c/h2>\n\u003cp>\u003cimg src=\"assets/04-terminal.png\" alt=\"本地终端\">\u003c/p>\n\u003cp>\u003cem>终端在当前项目目录启动；提示符可以确认当前 Shell 与目录。\u003c/em>\u003c/p>\n\u003col>\n\u003cli>在文件区进入项目目录，点击“终端”。\u003c/li>\n\u003cli>使用 \u003ccode>＋\u003c/code> 新建终端，通过标签切换。\u003c/li>\n\u003cli>标签过多时使用左右滚动箭头或全部标签列表。\u003c/li>\n\u003cli>拖动分隔条调整大小；使用布局按钮切换上下 / 左右排列。\u003c/li>\n\u003cli>使用铺满图标放大终端，再次点击恢复。\u003c/li>\n\u003c/ol>\n\u003cp>“收起终端”用于收起面板；关闭某个标签会关闭对应终端。两者不要混淆。进程退出后，界面会提示回车重开或关闭标签。\u003c/p>\n\u003cp>“定位文件”把文件区切到当前终端目录。路径拖入终端可用于输入文件路径，提交前检查带空格路径的引用是否正确。\u003c/p>\n\u003ch2>CMD 与 PowerShell 命令示例\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>目的\u003c/th>\n\u003cth>CMD\u003c/th>\n\u003cth>PowerShell\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>列出目录\u003c/td>\n\u003ctd>\u003ccode>dir\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Get-ChildItem\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显示当前目录\u003c/td>\n\u003ctd>\u003ccode>cd\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Get-Location\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>进入项目\u003c/td>\n\u003ctd>\u003ccode>cd /d D:\\code\\demo\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Set-Location D:\\code\\demo\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显示文本\u003c/td>\n\u003ctd>\u003ccode>type README.md\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Get-Content README.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Linux 的 \u003ccode>ll\u003c/code> 并非 Windows 通用命令；即便在 Linux 上，它也可能只是用户自定义别名。\u003c/p>\n\u003cp>中文输入按输入法正常选词，确认候选词后再回车提交命令。选词期间的回车不应直接提交终端命令。\u003c/p>\n\u003ch2>启动 Claude、Codex、CodeBuddy\u003c/h2>\n\u003cp>前提是相应 CLI 已安装、能在终端找到命令，并已完成登录或自己的模型配置。FanBox 的 AI 配置不会改写这些 CLI 的全局配置。\u003c/p>\n\u003cp>终端工具栏提供三个 CLI 图标。空闲终端可原地启动，忙碌时可能新建标签；以实际新标签和进程提示为准。\u003c/p>\n\u003cblockquote>\n\u003cp>当前版本的本地 Claude 快捷图标使用跳过权限确认的启动参数。希望保留 Claude 默认审批时，请在终端手动输入 \u003ccode>claude\u003c/code>。企业微信 \u003ccode>/claude\u003c/code> 的桥接启动流程与此本地图标不同，仍处理信任与权限交互。\u003c/p>\n\u003c/blockquote>\n\u003cp>Claude 底部出现 \u003ccode>shift+tab to cycle\u003c/code> 时，可使用工具栏权限图标切换模式。查看切换后的实际状态，不要把“发送按键”当作切换成功。\u003c/p>\n\u003ch2>手动终端与内置 AI 的区别\u003c/h2>\n\u003cp>终端键盘输入直接到 Shell / CLI。内置 AI 输入框中的文本先发送给启用的模型，由模型决定是否调用工具。已经进入 CLI 的企微会话会把普通消息原样发送给 CLI，详见 \u003ca href=\"wecom-commands.md\">企业微信命令\u003c/a>。\u003c/p>\n\u003cp>滚轮用于查看回滚内容，不代表重新执行命令。拖动分隔条会改变终端尺寸，CLI 可能重绘自己的界面；若发现异常重复，记录发生时是滚动还是改变尺寸，便于排查。\u003c/p>\n"},{"title":"SSH 会话与快捷命令","file":"ssh.md","text":"# SSH 会话与快捷命令\r\n\r\n## 新建连接\r\n\r\n![SSH 常规配置](assets/05-ssh-profile.png)\r\n\r\n*通过左侧 SSH 连接 → 会话管理旁的 ＋ 打开。示例地址不可用于实际登录。*\r\n\r\n1. 展开左侧“SSH 连接”。\r\n2. 点击“会话管理”旁的 `＋`。\r\n3. 在常规页填写连接名称、分组、主机、端口、用户名。\r\n4. 选择密码或私钥认证。\r\n5. 保存后展开会话管理树，点击连接名称登录。\r\n\r\n分组先显示，连接位于对应分组下；未分组连接单独列出。右键连接可编辑、删除、打开 AI 会话、访问远程文件或管理快捷命令。删除连接配置前，先确认它是否仍被使用。\r\n\r\n## 密码、私钥与首次验证\r\n\r\n- 填写了可用密码时直接认证；不填密码时，终端停在 `password:` 等待输入。\r\n- 密码输入不回显。输入错误后会提示重新输入，单次连接最多尝试 3 轮；服务器策略可能更早断开。\r\n- 未勾选“记住凭据”时，重启后需要重新输入。\r\n- 私钥认证需要选择本地私钥，若有口令则填写口令；支持服务器要求的交互认证。\r\n- 首次连接会显示主机指纹，请与服务器提供者核对。指纹变化时不要直接当作普通密码错误处理。\r\n- `Ctrl+C` 可取消当前认证。\r\n\r\n## 堡垒机、跳板与代理\r\n\r\n在连接 / 代理分类中设置终端类型、系统检测、跳板机以及 SOCKS5 / HTTP CONNECT 代理。通常先用默认项完成直连，再增加网络设置。\r\n\r\n齐治等堡垒机场景优先使用 `xterm`。登录出现 `Please re-login` 时，检查终端类型，并关闭普通 SSH 的提前系统检测；堡垒机可能把额外探测当作一次登录会话。AI 在适合探测的 Shell 提示符下会尝试识别目标系统，但无法确认时不会盲目执行命令。\r\n\r\n跳板机需先保存为连接，再在目标连接中选择。代理应配置在实际对外建立网络连接的那一层；使用跳板时留意代理位置。\r\n\r\n## 快捷命令分组\r\n\r\n1. 在对应 SSH 连接上右键，进入新增 / 管理快捷命令。\r\n2. 填写快捷名称、分组和多行命令。\r\n3. 保存后，在该连接的终端右键，按“快捷指令 → 分组 → 命令”选择。\r\n4. 输出直接在终端查看。列表默认显示名称，可点“查看”展开命令正文。\r\n\r\n例如创建“检查目录”分组下的“查看配置”：\r\n\r\n```sh\r\ncd /home/demo\r\nls -la\r\ncat test.txt\r\n```\r\n\r\n快捷命令按顺序输入当前终端，**不会等待每行命令完成后再决定下一行**。不要把需要密码、交互选择或长驻程序的多行流程当作自动化脚本使用。它只属于对应 SSH 连接，不会自动出现在其他连接下。\r\n\r\n## SSH 与企微会话不合并\r\n\r\nSSH 管理保存服务器连接参数；企微 `/new` 创建的是桥接终端会话。它们各自维护会话，不因项目名或用户名相同而共享历史。\r\n","html":"\u003ch1>SSH 会话与快捷命令\u003c/h1>\n\u003ch2>新建连接\u003c/h2>\n\u003cp>\u003cimg src=\"assets/05-ssh-profile.png\" alt=\"SSH 常规配置\">\u003c/p>\n\u003cp>\u003cem>通过左侧 SSH 连接 → 会话管理旁的 ＋ 打开。示例地址不可用于实际登录。\u003c/em>\u003c/p>\n\u003col>\n\u003cli>展开左侧“SSH 连接”。\u003c/li>\n\u003cli>点击“会话管理”旁的 \u003ccode>＋\u003c/code>。\u003c/li>\n\u003cli>在常规页填写连接名称、分组、主机、端口、用户名。\u003c/li>\n\u003cli>选择密码或私钥认证。\u003c/li>\n\u003cli>保存后展开会话管理树，点击连接名称登录。\u003c/li>\n\u003c/ol>\n\u003cp>分组先显示，连接位于对应分组下；未分组连接单独列出。右键连接可编辑、删除、打开 AI 会话、访问远程文件或管理快捷命令。删除连接配置前，先确认它是否仍被使用。\u003c/p>\n\u003ch2>密码、私钥与首次验证\u003c/h2>\n\u003cul>\n\u003cli>填写了可用密码时直接认证；不填密码时，终端停在 \u003ccode>password:\u003c/code> 等待输入。\u003c/li>\n\u003cli>密码输入不回显。输入错误后会提示重新输入，单次连接最多尝试 3 轮；服务器策略可能更早断开。\u003c/li>\n\u003cli>未勾选“记住凭据”时，重启后需要重新输入。\u003c/li>\n\u003cli>私钥认证需要选择本地私钥，若有口令则填写口令；支持服务器要求的交互认证。\u003c/li>\n\u003cli>首次连接会显示主机指纹，请与服务器提供者核对。指纹变化时不要直接当作普通密码错误处理。\u003c/li>\n\u003cli>\u003ccode>Ctrl+C\u003c/code> 可取消当前认证。\u003c/li>\n\u003c/ul>\n\u003ch2>堡垒机、跳板与代理\u003c/h2>\n\u003cp>在连接 / 代理分类中设置终端类型、系统检测、跳板机以及 SOCKS5 / HTTP CONNECT 代理。通常先用默认项完成直连，再增加网络设置。\u003c/p>\n\u003cp>齐治等堡垒机场景优先使用 \u003ccode>xterm\u003c/code>。登录出现 \u003ccode>Please re-login\u003c/code> 时，检查终端类型，并关闭普通 SSH 的提前系统检测；堡垒机可能把额外探测当作一次登录会话。AI 在适合探测的 Shell 提示符下会尝试识别目标系统，但无法确认时不会盲目执行命令。\u003c/p>\n\u003cp>跳板机需先保存为连接，再在目标连接中选择。代理应配置在实际对外建立网络连接的那一层；使用跳板时留意代理位置。\u003c/p>\n\u003ch2>快捷命令分组\u003c/h2>\n\u003col>\n\u003cli>在对应 SSH 连接上右键，进入新增 / 管理快捷命令。\u003c/li>\n\u003cli>填写快捷名称、分组和多行命令。\u003c/li>\n\u003cli>保存后，在该连接的终端右键，按“快捷指令 → 分组 → 命令”选择。\u003c/li>\n\u003cli>输出直接在终端查看。列表默认显示名称，可点“查看”展开命令正文。\u003c/li>\n\u003c/ol>\n\u003cp>例如创建“检查目录”分组下的“查看配置”：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">cd /home/demo\nls -la\ncat test.txt\n\u003c/code>\u003c/pre>\n\u003cp>快捷命令按顺序输入当前终端，\u003cstrong>不会等待每行命令完成后再决定下一行\u003c/strong>。不要把需要密码、交互选择或长驻程序的多行流程当作自动化脚本使用。它只属于对应 SSH 连接，不会自动出现在其他连接下。\u003c/p>\n\u003ch2>SSH 与企微会话不合并\u003c/h2>\n\u003cp>SSH 管理保存服务器连接参数；企微 \u003ccode>/new\u003c/code> 创建的是桥接终端会话。它们各自维护会话，不因项目名或用户名相同而共享历史。\u003c/p>\n"},{"title":"远程文件与传输","file":"remote-files.md","text":"# 远程文件与传输\r\n\r\n远程文件使用当前 SSH 连接的 SFTP 能力。能打开 Shell 不等于服务器一定允许 SFTP；堡垒机需同时允许文件传输。\r\n\r\n## 浏览与返回上级\r\n\r\n1. 先连接目标 SSH 会话。\r\n2. 在会话的右键菜单中打开“远程文件”，或在 AI 会话选项中打开。\r\n3. 检查页面上的连接目标，确认当前操作的是正确服务器。\r\n4. 双击文件夹进入下一层。\r\n5. 点击上方路径的某一段返回对应目录，或使用上级目录箭头。\r\n\r\n目录按页显示，每页最多 200 项。大目录先翻页或进入子目录，不要把第一页误认为全部文件。\r\n\r\n## 编辑远程文本\r\n\r\n双击支持的文本文件进入编辑，修改后点击“保存到远端”。当前支持小于 2 MB 的 UTF-8 文本；二进制或其他编码文件建议下载后处理。\r\n\r\n保存时会检查文件是否被其他程序修改。遇到冲突提示，先保留你的修改，再重新读取远端内容做比较，不要反复强制覆盖。\r\n\r\n## 上传、下载、取消和重试\r\n\r\n使用远程文件页面的上传 / 下载操作，按系统文件选择框选择本地源或目标路径。传输区域会显示状态、已传字节和进度。\r\n\r\n- **取消：**中止当前传输；连接断开时可能留下临时文件。\r\n- **重试：**重新选择本地文件或保存位置，避免无意覆盖后来更新的文件。\r\n- **覆盖失败：**部分 SFTP 服务不支持所需的覆盖重命名操作，原文件会保留，应按错误提示处理。\r\n\r\n## 与企微发送文件的关系\r\n\r\n远程文件下载与企微附件发送是两步：先下载到运行 FanBox 的 Windows 电脑，再让 Agent 把本地文件发送到当前企微会话。不能把 `/home/demo/report.md` 这样的远端路径直接当作 Windows 本机文件发送。\r\n\r\n本章没有使用真实服务器截图；入口与步骤以当前实现为准，避免将本地文件浏览截图误标为 SFTP 页面。\r\n\n## 在 SSH 终端使用 rz / sz\n\n内置 SSH 会话支持 ZMODEM 文件传输，使用当前 Shell 通道，不要求另开 SFTP。远端需要提供 `rz` / `sz`（通常来自 lrzsz）；堡垒机也需允许该协议通过。\n\n- **Windows 上传到 SSH：**在远端终端输入 `rz` 并回车，弹出的文件选择框可选择一个或多个 Windows 文件。文件写入远端当前目录；覆盖行为由远端 rz 参数决定。\n- **SSH 下载到 Windows：**输入 `sz 文件名` 并回车，例如 `sz report.txt`，在 Windows 保存对话框中选择目标位置。多文件会逐个选择保存位置。\n- **进度：**终端显示文件名、已传字节和完成状态。\n- **取消：**传输时按 Ctrl+C；取消上传文件选择也会中止传输，取消下载保存框则跳过该文件。\n- **异常：**连接断开或连续两分钟没有传输进展会取消。下载先写临时文件，完整接收后才替换目标文件；失败时保留原目标文件。上传失败后的远端残留由远端 rz 处理。\n\n每个文件必须小于 4 GB，不支持断点续传。传输期间请等待结束再输入其他命令。此功能适用于从“SSH 链接”打开的内置 SSH 终端；在本地 CMD / PowerShell 中手动运行 ssh.exe 不属于该通道。\r\n","html":"\u003ch1>远程文件与传输\u003c/h1>\n\u003cp>远程文件使用当前 SSH 连接的 SFTP 能力。能打开 Shell 不等于服务器一定允许 SFTP；堡垒机需同时允许文件传输。\u003c/p>\n\u003ch2>浏览与返回上级\u003c/h2>\n\u003col>\n\u003cli>先连接目标 SSH 会话。\u003c/li>\n\u003cli>在会话的右键菜单中打开“远程文件”，或在 AI 会话选项中打开。\u003c/li>\n\u003cli>检查页面上的连接目标，确认当前操作的是正确服务器。\u003c/li>\n\u003cli>双击文件夹进入下一层。\u003c/li>\n\u003cli>点击上方路径的某一段返回对应目录，或使用上级目录箭头。\u003c/li>\n\u003c/ol>\n\u003cp>目录按页显示，每页最多 200 项。大目录先翻页或进入子目录，不要把第一页误认为全部文件。\u003c/p>\n\u003ch2>编辑远程文本\u003c/h2>\n\u003cp>双击支持的文本文件进入编辑，修改后点击“保存到远端”。当前支持小于 2 MB 的 UTF-8 文本；二进制或其他编码文件建议下载后处理。\u003c/p>\n\u003cp>保存时会检查文件是否被其他程序修改。遇到冲突提示，先保留你的修改，再重新读取远端内容做比较，不要反复强制覆盖。\u003c/p>\n\u003ch2>上传、下载、取消和重试\u003c/h2>\n\u003cp>使用远程文件页面的上传 / 下载操作，按系统文件选择框选择本地源或目标路径。传输区域会显示状态、已传字节和进度。\u003c/p>\n\u003cul>\n\u003cli>**取消：**中止当前传输；连接断开时可能留下临时文件。\u003c/li>\n\u003cli>**重试：**重新选择本地文件或保存位置，避免无意覆盖后来更新的文件。\u003c/li>\n\u003cli>**覆盖失败：**部分 SFTP 服务不支持所需的覆盖重命名操作，原文件会保留，应按错误提示处理。\u003c/li>\n\u003c/ul>\n\u003ch2>与企微发送文件的关系\u003c/h2>\n\u003cp>远程文件下载与企微附件发送是两步：先下载到运行 FanBox 的 Windows 电脑，再让 Agent 把本地文件发送到当前企微会话。不能把 \u003ccode>/home/demo/report.md\u003c/code> 这样的远端路径直接当作 Windows 本机文件发送。\u003c/p>\n\u003cp>本章没有使用真实服务器截图；入口与步骤以当前实现为准，避免将本地文件浏览截图误标为 SFTP 页面。\u003c/p>\n\u003ch2>在 SSH 终端使用 rz / sz\u003c/h2>\n\u003cp>内置 SSH 会话支持 ZMODEM 文件传输，使用当前 Shell 通道，不要求另开 SFTP。远端需要提供 \u003ccode>rz\u003c/code> / \u003ccode>sz\u003c/code>（通常来自 lrzsz）；堡垒机也需允许该协议通过。\u003c/p>\n\u003cul>\n\u003cli>**Windows 上传到 SSH：**在远端终端输入 \u003ccode>rz\u003c/code> 并回车，弹出的文件选择框可选择一个或多个 Windows 文件。文件写入远端当前目录；覆盖行为由远端 rz 参数决定。\u003c/li>\n\u003cli>**SSH 下载到 Windows：**输入 \u003ccode>sz 文件名\u003c/code> 并回车，例如 \u003ccode>sz report.txt\u003c/code>，在 Windows 保存对话框中选择目标位置。多文件会逐个选择保存位置。\u003c/li>\n\u003cli>**进度：**终端显示文件名、已传字节和完成状态。\u003c/li>\n\u003cli>**取消：**传输时按 Ctrl+C；取消上传文件选择也会中止传输，取消下载保存框则跳过该文件。\u003c/li>\n\u003cli>**异常：**连接断开或连续两分钟没有传输进展会取消。下载先写临时文件，完整接收后才替换目标文件；失败时保留原目标文件。上传失败后的远端残留由远端 rz 处理。\u003c/li>\n\u003c/ul>\n\u003cp>每个文件必须小于 4 GB，不支持断点续传。传输期间请等待结束再输入其他命令。此功能适用于从“SSH 链接”打开的内置 SSH 终端；在本地 CMD / PowerShell 中手动运行 ssh.exe 不属于该通道。\u003c/p>\n"},{"title":"AI 服务、模型选择与测试","file":"ai-settings.md","text":"# AI 服务、模型选择与测试\r\n\r\n## 新增服务配置\r\n\r\n![AI 服务配置表单](assets/06-model-service.png)\r\n\r\n*一套服务共用地址和密钥，可选择多个模型。示例使用本机测试服务。*\r\n\r\n1. 打开“设置 → AI 配置”，点击“新增 AI 配置”。\r\n2. 填写名称，选择 OpenAI 兼容或 Anthropic / Claude 协议。\r\n3. 填入服务提供方给出的 API 基础地址和密钥。\r\n4. 点击“获取所有模型”，在返回的模型卡片中选择需要的模型。\r\n5. 指定默认模型或用途映射，保存并启用。\r\n\r\nHTTP 与 HTTPS 都支持，必须与服务实际提供的协议一致。例如服务给出 `http://服务器/public/` 时，不要自行改成 `https://`。OpenAI 对话基础地址通常包含 `/v1`；Anthropic 基础地址可以为服务根地址或包含 `/v1`，以服务的兼容接口说明为准。\r\n\r\n不要把 `/models` 或 `/chat/completions` 完整接口直接当成对话基础地址。模型列表能获取，只证明列表接口可用，不代表对话接口、模型权限和工具调用都可用。\r\n\r\n## 选模型、默认模型与用途映射\r\n\r\n![模型选择、检测和配置](assets/07-model-selection.png)\r\n\r\n*上方卡片用来勾选模型，下方表格用来设置默认模型、检测和调整参数。*\r\n\r\n- 使用搜索框筛选模型。\r\n- 勾选模型加入当前配置；没有列表时可手动输入模型 ID。\r\n- 星标表示默认模型；选择默认用途时以用途映射为准。\r\n- Anthropic 可配置 Haiku / Sonnet / Opus 的模型映射，位置可以使用同一个模型。\r\n- OpenAI 兼容配置同样支持单服务内多个模型，不需要为每个模型复制地址和密钥。\r\n- 这些配置用于 FanBox 内置 AI，不会改写 Claude / Codex / CodeBuddy CLI 自己的配置文件。\r\n\r\n## 逐个测试与配置参数\r\n\r\n点击已选模型行上的“检测”。成功后显示耗时和简短回复；失败显示错误。检测只发送简短测试消息，不操作终端，也不能替代完整工具调用兼容性测试。\r\n\r\n![单模型参数窗口](assets/08-model-parameters.png)\r\n\r\n| 参数 | 含义 |\r\n| --- | --- |\r\n| 模型 ID | 服务提供方识别模型的名称；不要自行翻译 |\r\n| 上下文窗口 | 记录模型容量的信息，不会扩大模型真实容量 |\r\n| 最大输出 tokens | 本次响应的输出上限；过小可能截断工具参数 |\r\n| 温度 | 可选，服务必须支持此参数 |\r\n| 推理强度 | 用于支持该参数的 OpenAI 兼容模型；Anthropic 不发送此参数 |\r\n\r\n修改后点击“应用参数”，最后保存整套配置。检测结果因地址、密钥或参数变化而失效时，应重新检测。\r\n\r\n## 启用、停用和密钥查看\r\n\r\n同时启用一套 AI 配置。启用后按钮显示“停用”；停用后不会自动切换到其他配置。没有启用配置时不能发起新的 AI 任务。\r\n\r\n切换对下一轮任务生效，已在运行的任务请在聊天页停止。密钥默认遮罩，点击眼睛图标查看，再次点击隐藏；编辑时留空通常保留已保存密钥。更换服务地址或协议时，按提示重新输入对应密钥。\r\n","html":"\u003ch1>AI 服务、模型选择与测试\u003c/h1>\n\u003ch2>新增服务配置\u003c/h2>\n\u003cp>\u003cimg src=\"assets/06-model-service.png\" alt=\"AI 服务配置表单\">\u003c/p>\n\u003cp>\u003cem>一套服务共用地址和密钥，可选择多个模型。示例使用本机测试服务。\u003c/em>\u003c/p>\n\u003col>\n\u003cli>打开“设置 → AI 配置”，点击“新增 AI 配置”。\u003c/li>\n\u003cli>填写名称，选择 OpenAI 兼容或 Anthropic / Claude 协议。\u003c/li>\n\u003cli>填入服务提供方给出的 API 基础地址和密钥。\u003c/li>\n\u003cli>点击“获取所有模型”，在返回的模型卡片中选择需要的模型。\u003c/li>\n\u003cli>指定默认模型或用途映射，保存并启用。\u003c/li>\n\u003c/ol>\n\u003cp>HTTP 与 HTTPS 都支持，必须与服务实际提供的协议一致。例如服务给出 \u003ccode>http://服务器/public/\u003c/code> 时，不要自行改成 \u003ccode>https://\u003c/code>。OpenAI 对话基础地址通常包含 \u003ccode>/v1\u003c/code>；Anthropic 基础地址可以为服务根地址或包含 \u003ccode>/v1\u003c/code>，以服务的兼容接口说明为准。\u003c/p>\n\u003cp>不要把 \u003ccode>/models\u003c/code> 或 \u003ccode>/chat/completions\u003c/code> 完整接口直接当成对话基础地址。模型列表能获取，只证明列表接口可用，不代表对话接口、模型权限和工具调用都可用。\u003c/p>\n\u003ch2>选模型、默认模型与用途映射\u003c/h2>\n\u003cp>\u003cimg src=\"assets/07-model-selection.png\" alt=\"模型选择、检测和配置\">\u003c/p>\n\u003cp>\u003cem>上方卡片用来勾选模型，下方表格用来设置默认模型、检测和调整参数。\u003c/em>\u003c/p>\n\u003cul>\n\u003cli>使用搜索框筛选模型。\u003c/li>\n\u003cli>勾选模型加入当前配置；没有列表时可手动输入模型 ID。\u003c/li>\n\u003cli>星标表示默认模型；选择默认用途时以用途映射为准。\u003c/li>\n\u003cli>Anthropic 可配置 Haiku / Sonnet / Opus 的模型映射，位置可以使用同一个模型。\u003c/li>\n\u003cli>OpenAI 兼容配置同样支持单服务内多个模型，不需要为每个模型复制地址和密钥。\u003c/li>\n\u003cli>这些配置用于 FanBox 内置 AI，不会改写 Claude / Codex / CodeBuddy CLI 自己的配置文件。\u003c/li>\n\u003c/ul>\n\u003ch2>逐个测试与配置参数\u003c/h2>\n\u003cp>点击已选模型行上的“检测”。成功后显示耗时和简短回复；失败显示错误。检测只发送简短测试消息，不操作终端，也不能替代完整工具调用兼容性测试。\u003c/p>\n\u003cp>\u003cimg src=\"assets/08-model-parameters.png\" alt=\"单模型参数窗口\">\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模型 ID\u003c/td>\n\u003ctd>服务提供方识别模型的名称；不要自行翻译\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文窗口\u003c/td>\n\u003ctd>记录模型容量的信息，不会扩大模型真实容量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最大输出 tokens\u003c/td>\n\u003ctd>本次响应的输出上限；过小可能截断工具参数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>温度\u003c/td>\n\u003ctd>可选，服务必须支持此参数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>推理强度\u003c/td>\n\u003ctd>用于支持该参数的 OpenAI 兼容模型；Anthropic 不发送此参数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>修改后点击“应用参数”，最后保存整套配置。检测结果因地址、密钥或参数变化而失效时，应重新检测。\u003c/p>\n\u003ch2>启用、停用和密钥查看\u003c/h2>\n\u003cp>同时启用一套 AI 配置。启用后按钮显示“停用”；停用后不会自动切换到其他配置。没有启用配置时不能发起新的 AI 任务。\u003c/p>\n\u003cp>切换对下一轮任务生效，已在运行的任务请在聊天页停止。密钥默认遮罩，点击眼睛图标查看，再次点击隐藏；编辑时留空通常保留已保存密钥。更换服务地址或协议时，按提示重新输入对应密钥。\u003c/p>\n"},{"title":"AI 对话、授权与长任务","file":"ai-chat.md","text":"# AI 对话、授权与长任务\r\n\r\n## 打开对应终端的 AI 会话\r\n\r\n![左侧 AI 对话与右侧终端](assets/09-ai-chat.png)\r\n\r\n*截图中的回复来自本机演示模型，展示的是未开启执行权限时的状态。*\r\n\r\n右键终端标签或 SSH 会话，选择“打开 AI 会话”。左侧是聊天，右侧是绑定终端；顶部可以切换会话。输入框始终位于聊天区域底部，消息区独立滚动。\r\n\r\n输入任务后按 Enter 发送，Shift+Enter 换行。用户消息显示在右侧，AI 消息在左侧。模型返回的分析可折叠显示；没有返回分析时只显示实际进度，不补造内容。\r\n\r\n## 开启执行权限\r\n\r\n![会话选项与执行权限](assets/10-ai-permissions.png)\r\n\r\n1. 点击输入框旁的权限按钮或会话选项图标。\r\n2. 选择“确认后执行”。\r\n3. 开启“允许 AI 交互式终端”。\r\n4. 核对当前目标、系统和 Shell。\r\n5. 发送一个明确的小任务，例如“列出当前目录文件，不修改任何内容”。\r\n\r\n| 模式 | 实际行为 |\r\n| --- | --- |\r\n| 仅建议 | 只给建议，没有命令执行工具 |\r\n| 确认后执行 | 普通命令逐条弹窗确认 |\r\n| 自动执行 | 按授权直接执行普通命令；适用于明确且可信任的任务 |\r\n\r\n交互输入仍需确认前台程序及目标；开启自动执行不代表所有交互都永久批准。内置 AI 的权限与 CLI 自身的权限模式是两套设置。\r\n\r\n## 阅读授权窗口\r\n\r\n![授权窗口：目标、命令、说明与按钮](assets/12-command-approval.png)\r\n\r\n*此图是用真实弹窗组件打开的授权演示，不会执行图中的命令。*\r\n\r\n先看目标和系统，再看命令正文。点击“仅允许本次”后才会发送；取消、关闭或 Escape 都不会批准。长命令可以在命令区域滚动查看。\r\n\r\n命令直接写入右侧现有终端，继承当前目录和环境。先让终端回到 Shell 提示符并清除未提交输入。操作和输出以右侧终端为准，AI 聊天不会重复倾倒全部日志。\r\n\r\n## 系统识别与目标变化\r\n\r\nSSH 系统未知时，AI 会在适合识别的提示符下尝试只读探测。无法可靠识别或检测到手工 SSH / 容器切换时，会阻止盲目执行；按提示选择正确目标或确认系统后再继续。不要根据最初的 Windows 终端类型，假定嵌套登录的 Linux 仍应使用 Windows 命令。\r\n\r\n## 长命令会等多久\r\n\r\n| 情况 | 当前行为 |\r\n| --- | --- |\r\n| 命令运行超过 1 分钟 | 标记为长时间运行，继续监听 |\r\n| 15 秒没有新输出 | 提示暂时没有新输出，不判定失败 |\r\n| 超过 5 分钟 | 提醒一次，继续等待 |\r\n| 收到 Shell 完成标记 | 认定本条命令结束，AI 分析结果 |\r\n| 用户点击停止 | 发送 Ctrl+C，最多再等 10 秒确认结束 |\r\n| 连接断开 | 报告状态未知，不声称远端进程已被杀掉 |\r\n| 模型连续 5 分钟没有新数据 | 停止等模型回复；此前执行的命令不自动重试 |\r\n\r\n命令没有固定最长执行时间。`tail -f`、服务器前台进程等可能一直不结束，应使用有限观察、合适的后台运行方式或人工接管。\r\n\r\n## 停止、接管与继续\r\n\r\n**停止 AI：**请求中断当前命令，结束后续处理。即使已发送 Ctrl+C，也要看是否收到完成确认。\r\n\r\n**接管终端：**不主动中断命令，暂停 AI 的后续操作，让你手动处理。处理完点击“让 AI 继续”，程序重新检查目标、权限与未提交输入；后续命令需要重新确认。\r\n\r\n**发送“继续”：**新的一轮会读取最新用户目标、执行结果和中断原因。每轮最多 10 次模型请求，到上限后可以继续；不是只保留最初任务。不要以“继续”替代对未知执行结果的检查。\r\n\r\n若你希望 AI 使用本轮之前的手工终端输出，勾选“发送终端最近 16 KB 内容”。AI 自己执行命令得到的结果会作为后续判断依据发送给模型，不依赖这个额外快照开关。\r\n","html":"\u003ch1>AI 对话、授权与长任务\u003c/h1>\n\u003ch2>打开对应终端的 AI 会话\u003c/h2>\n\u003cp>\u003cimg src=\"assets/09-ai-chat.png\" alt=\"左侧 AI 对话与右侧终端\">\u003c/p>\n\u003cp>\u003cem>截图中的回复来自本机演示模型，展示的是未开启执行权限时的状态。\u003c/em>\u003c/p>\n\u003cp>右键终端标签或 SSH 会话，选择“打开 AI 会话”。左侧是聊天，右侧是绑定终端；顶部可以切换会话。输入框始终位于聊天区域底部，消息区独立滚动。\u003c/p>\n\u003cp>输入任务后按 Enter 发送，Shift+Enter 换行。用户消息显示在右侧，AI 消息在左侧。模型返回的分析可折叠显示；没有返回分析时只显示实际进度，不补造内容。\u003c/p>\n\u003ch2>开启执行权限\u003c/h2>\n\u003cp>\u003cimg src=\"assets/10-ai-permissions.png\" alt=\"会话选项与执行权限\">\u003c/p>\n\u003col>\n\u003cli>点击输入框旁的权限按钮或会话选项图标。\u003c/li>\n\u003cli>选择“确认后执行”。\u003c/li>\n\u003cli>开启“允许 AI 交互式终端”。\u003c/li>\n\u003cli>核对当前目标、系统和 Shell。\u003c/li>\n\u003cli>发送一个明确的小任务，例如“列出当前目录文件，不修改任何内容”。\u003c/li>\n\u003c/ol>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>实际行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>仅建议\u003c/td>\n\u003ctd>只给建议，没有命令执行工具\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>确认后执行\u003c/td>\n\u003ctd>普通命令逐条弹窗确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自动执行\u003c/td>\n\u003ctd>按授权直接执行普通命令；适用于明确且可信任的任务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>交互输入仍需确认前台程序及目标；开启自动执行不代表所有交互都永久批准。内置 AI 的权限与 CLI 自身的权限模式是两套设置。\u003c/p>\n\u003ch2>阅读授权窗口\u003c/h2>\n\u003cp>\u003cimg src=\"assets/12-command-approval.png\" alt=\"授权窗口：目标、命令、说明与按钮\">\u003c/p>\n\u003cp>\u003cem>此图是用真实弹窗组件打开的授权演示，不会执行图中的命令。\u003c/em>\u003c/p>\n\u003cp>先看目标和系统，再看命令正文。点击“仅允许本次”后才会发送；取消、关闭或 Escape 都不会批准。长命令可以在命令区域滚动查看。\u003c/p>\n\u003cp>命令直接写入右侧现有终端，继承当前目录和环境。先让终端回到 Shell 提示符并清除未提交输入。操作和输出以右侧终端为准，AI 聊天不会重复倾倒全部日志。\u003c/p>\n\u003ch2>系统识别与目标变化\u003c/h2>\n\u003cp>SSH 系统未知时，AI 会在适合识别的提示符下尝试只读探测。无法可靠识别或检测到手工 SSH / 容器切换时，会阻止盲目执行；按提示选择正确目标或确认系统后再继续。不要根据最初的 Windows 终端类型，假定嵌套登录的 Linux 仍应使用 Windows 命令。\u003c/p>\n\u003ch2>长命令会等多久\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>当前行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>命令运行超过 1 分钟\u003c/td>\n\u003ctd>标记为长时间运行，继续监听\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15 秒没有新输出\u003c/td>\n\u003ctd>提示暂时没有新输出，不判定失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超过 5 分钟\u003c/td>\n\u003ctd>提醒一次，继续等待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收到 Shell 完成标记\u003c/td>\n\u003ctd>认定本条命令结束，AI 分析结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用户点击停止\u003c/td>\n\u003ctd>发送 Ctrl+C，最多再等 10 秒确认结束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接断开\u003c/td>\n\u003ctd>报告状态未知，不声称远端进程已被杀掉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型连续 5 分钟没有新数据\u003c/td>\n\u003ctd>停止等模型回复；此前执行的命令不自动重试\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>命令没有固定最长执行时间。\u003ccode>tail -f\u003c/code>、服务器前台进程等可能一直不结束，应使用有限观察、合适的后台运行方式或人工接管。\u003c/p>\n\u003ch2>停止、接管与继续\u003c/h2>\n\u003cp>**停止 AI：**请求中断当前命令，结束后续处理。即使已发送 Ctrl+C，也要看是否收到完成确认。\u003c/p>\n\u003cp>**接管终端：**不主动中断命令，暂停 AI 的后续操作，让你手动处理。处理完点击“让 AI 继续”，程序重新检查目标、权限与未提交输入；后续命令需要重新确认。\u003c/p>\n\u003cp>**发送“继续”：**新的一轮会读取最新用户目标、执行结果和中断原因。每轮最多 10 次模型请求，到上限后可以继续；不是只保留最初任务。不要以“继续”替代对未知执行结果的检查。\u003c/p>\n\u003cp>若你希望 AI 使用本轮之前的手工终端输出，勾选“发送终端最近 16 KB 内容”。AI 自己执行命令得到的结果会作为后续判断依据发送给模型，不依赖这个额外快照开关。\u003c/p>\n"},{"title":"会话历史与上下文","file":"history.md","text":"# 会话历史与上下文\r\n\r\n## 查看、继续或删除\r\n\r\n![会话历史表格](assets/11-history.png)\r\n\r\n*入口位于对应 AI 会话顶部，不在顶层设置菜单中。*\r\n\r\n1. 打开要查看的终端 AI 会话。\r\n2. 点击“会话历史”。\r\n3. 在表格中按标题、更新时间和状态查找记录。\r\n4. 点击“查看”阅读，或点击“继续”恢复到当前对应终端。\r\n5. 不再需要时点击“删除”，核对确认弹窗中的会话名称。\r\n\r\n删除记录不可恢复，但不会删除项目文件或 SSH 连接配置。运行中的记录不能直接删除，应先停止任务。\r\n\r\n“新对话”保留旧历史并开始新的上下文；它与删除历史不同。\r\n\r\n## 绑定规则\r\n\r\n一个终端绑定一段对话。不同终端默认不共享上下文，即便连到同一台服务器也是如此。一段历史不能同时绑定两个终端；可在原终端继续，或先关闭原终端，再在匹配目标的连接中恢复。\r\n\r\nSSH 历史按对应连接与服务器身份区分。本地历史按机器和 Shell 区分。企微桥接的会话还有其自身归属，不能通过编号去访问其他账号的会话。\r\n\r\n## “继续”时模型看到了什么\r\n\r\n同一运行中的终端会保留最近对话、工具调用、结果以及中断信息。正常完成、超时、取消、达到步数上限都会更新上下文；结果未知的操作会明确标记未知，不应直接重试。\r\n\r\n较长历史会保留近期对话，对更早内容做有损摘录，较长工具输出会省略中间部分。这不是无限记忆，也不是完整逐字归档；涉及很久以前的约束，建议重述关键条件。\r\n\r\n## 重启后的限制\r\n\r\n磁盘历史保存用户消息、AI 回复、服务返回的分析、命令标记、错误和状态。**不保存原始终端输出、运行进程或授权状态。**\r\n\r\n从历史恢复时，模型能看到最近文字和命令说明，但无法据此证明旧命令成功完成；应先检查终端当前状态。软件退出时未结束的任务不会自动重跑。旧版本没有保存下来的信息无法恢复。\r\n\r\n消息区默认展示最近一部分记录，可加载更早消息；显示范围与发给模型的上下文范围并不完全相同。\r\n","html":"\u003ch1>会话历史与上下文\u003c/h1>\n\u003ch2>查看、继续或删除\u003c/h2>\n\u003cp>\u003cimg src=\"assets/11-history.png\" alt=\"会话历史表格\">\u003c/p>\n\u003cp>\u003cem>入口位于对应 AI 会话顶部，不在顶层设置菜单中。\u003c/em>\u003c/p>\n\u003col>\n\u003cli>打开要查看的终端 AI 会话。\u003c/li>\n\u003cli>点击“会话历史”。\u003c/li>\n\u003cli>在表格中按标题、更新时间和状态查找记录。\u003c/li>\n\u003cli>点击“查看”阅读，或点击“继续”恢复到当前对应终端。\u003c/li>\n\u003cli>不再需要时点击“删除”，核对确认弹窗中的会话名称。\u003c/li>\n\u003c/ol>\n\u003cp>删除记录不可恢复，但不会删除项目文件或 SSH 连接配置。运行中的记录不能直接删除，应先停止任务。\u003c/p>\n\u003cp>“新对话”保留旧历史并开始新的上下文；它与删除历史不同。\u003c/p>\n\u003ch2>绑定规则\u003c/h2>\n\u003cp>一个终端绑定一段对话。不同终端默认不共享上下文，即便连到同一台服务器也是如此。一段历史不能同时绑定两个终端；可在原终端继续，或先关闭原终端，再在匹配目标的连接中恢复。\u003c/p>\n\u003cp>SSH 历史按对应连接与服务器身份区分。本地历史按机器和 Shell 区分。企微桥接的会话还有其自身归属，不能通过编号去访问其他账号的会话。\u003c/p>\n\u003ch2>“继续”时模型看到了什么\u003c/h2>\n\u003cp>同一运行中的终端会保留最近对话、工具调用、结果以及中断信息。正常完成、超时、取消、达到步数上限都会更新上下文；结果未知的操作会明确标记未知，不应直接重试。\u003c/p>\n\u003cp>较长历史会保留近期对话，对更早内容做有损摘录，较长工具输出会省略中间部分。这不是无限记忆，也不是完整逐字归档；涉及很久以前的约束，建议重述关键条件。\u003c/p>\n\u003ch2>重启后的限制\u003c/h2>\n\u003cp>磁盘历史保存用户消息、AI 回复、服务返回的分析、命令标记、错误和状态。\u003cstrong>不保存原始终端输出、运行进程或授权状态。\u003c/strong>\u003c/p>\n\u003cp>从历史恢复时，模型能看到最近文字和命令说明，但无法据此证明旧命令成功完成；应先检查终端当前状态。软件退出时未结束的任务不会自动重跑。旧版本没有保存下来的信息无法恢复。\u003c/p>\n\u003cp>消息区默认展示最近一部分记录，可加载更早消息；显示范围与发给模型的上下文范围并不完全相同。\u003c/p>\n"},{"title":"企业微信机器人绑定","file":"wecom-setup.md","text":"# 企业微信机器人绑定\r\n\r\n## 配置入口\r\n\r\n![IM 远程干预与通知](assets/13-im-settings.png)\r\n\r\n*入口：设置 → IM 远程干预与通知。截图未绑定真实机器人。*\r\n\r\n需要运行 FanBox 的电脑保持开机、软件运行，并能连接企业微信服务。手机上的企业微信不替代电脑上的执行环境。\r\n\r\n## 扫码或手动添加\r\n\r\n1. 打开 IM 设置，点击“扫码创建机器人”。\r\n2. 使用企业微信扫码并完成界面要求的确认；二维码通常 5 分钟有效。\r\n3. 如果扫码不可用，可展开手动凭据，填写已有智能机器人的 Bot ID 和 Secret。\r\n4. 启用机器人并保存，检查连接状态与错误提示。\r\n5. 用准备绑定的企业微信账号给机器人发送一条私聊消息。\r\n6. 回到电脑端，在接收账号列表中确认并绑定。\r\n\r\n只填凭据不等于完成账号绑定；只有已绑定账号才可以操作终端。扫码结果、组织权限和网络条件可能影响创建流程，遇到失败按页面错误处理。\r\n\r\nSecret 默认遮罩，可通过眼睛图标查看 / 隐藏。提示凭据无法解密时，重新扫码或重新填写 Secret 后保存，不要把空输入当作已经恢复凭据。\r\n\r\n## 配置执行环境\r\n\r\n![远程操作、目录与权限](assets/14-im-options.png)\r\n\r\n| 设置 | 如何选择 |\r\n| --- | --- |\r\n| 允许已绑定账号操作终端 | 开启后才允许远程执行 |\r\n| 处理方式 | AI 分析并执行，或默认使用某个 CLI |\r\n| 终端 | Windows CMD 或 PowerShell |\r\n| 命令权限 | 初次使用选择通过企微按钮批准 / 拒绝 |\r\n| 工作目录 | 已存在的本地目录，例如 `D:\\code` |\r\n| 任务接收通知 | 控制接收提示；结果、错误、权限请求仍会回复 |\r\n\r\n点击“保存设置”，应显示“保存成功”或具体失败原因。改变连接或处理方式可能使现有桥接路由结束，下次消息创建新会话；修改前先结束正在执行的任务。\r\n\r\n## 首次验证\r\n\r\n在企微发送以下消息，逐步确认：\r\n\r\n```text\r\n/projects\r\n/new demo\r\n/list\r\n请告诉我当前终端的系统和目录，先不要修改文件。\r\n```\r\n\r\n`demo` 应替换为工作目录下实际存在的项目。内置 AI 处理需要启用有效的 AI 配置；CLI 处理需要本机 CLI 安装及登录完成。\r\n\r\n当手机发消息没反应时，优先查看 IM 页面的连接状态、绑定账号和执行授权，而不是仅看宠物是否在动。\r\n","html":"\u003ch1>企业微信机器人绑定\u003c/h1>\n\u003ch2>配置入口\u003c/h2>\n\u003cp>\u003cimg src=\"assets/13-im-settings.png\" alt=\"IM 远程干预与通知\">\u003c/p>\n\u003cp>\u003cem>入口：设置 → IM 远程干预与通知。截图未绑定真实机器人。\u003c/em>\u003c/p>\n\u003cp>需要运行 FanBox 的电脑保持开机、软件运行，并能连接企业微信服务。手机上的企业微信不替代电脑上的执行环境。\u003c/p>\n\u003ch2>扫码或手动添加\u003c/h2>\n\u003col>\n\u003cli>打开 IM 设置，点击“扫码创建机器人”。\u003c/li>\n\u003cli>使用企业微信扫码并完成界面要求的确认；二维码通常 5 分钟有效。\u003c/li>\n\u003cli>如果扫码不可用，可展开手动凭据，填写已有智能机器人的 Bot ID 和 Secret。\u003c/li>\n\u003cli>启用机器人并保存，检查连接状态与错误提示。\u003c/li>\n\u003cli>用准备绑定的企业微信账号给机器人发送一条私聊消息。\u003c/li>\n\u003cli>回到电脑端，在接收账号列表中确认并绑定。\u003c/li>\n\u003c/ol>\n\u003cp>只填凭据不等于完成账号绑定；只有已绑定账号才可以操作终端。扫码结果、组织权限和网络条件可能影响创建流程，遇到失败按页面错误处理。\u003c/p>\n\u003cp>Secret 默认遮罩，可通过眼睛图标查看 / 隐藏。提示凭据无法解密时，重新扫码或重新填写 Secret 后保存，不要把空输入当作已经恢复凭据。\u003c/p>\n\u003ch2>配置执行环境\u003c/h2>\n\u003cp>\u003cimg src=\"assets/14-im-options.png\" alt=\"远程操作、目录与权限\">\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>设置\u003c/th>\n\u003cth>如何选择\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>允许已绑定账号操作终端\u003c/td>\n\u003ctd>开启后才允许远程执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>处理方式\u003c/td>\n\u003ctd>AI 分析并执行，或默认使用某个 CLI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>终端\u003c/td>\n\u003ctd>Windows CMD 或 PowerShell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>命令权限\u003c/td>\n\u003ctd>初次使用选择通过企微按钮批准 / 拒绝\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作目录\u003c/td>\n\u003ctd>已存在的本地目录，例如 \u003ccode>D:\\code\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务接收通知\u003c/td>\n\u003ctd>控制接收提示；结果、错误、权限请求仍会回复\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>点击“保存设置”，应显示“保存成功”或具体失败原因。改变连接或处理方式可能使现有桥接路由结束，下次消息创建新会话；修改前先结束正在执行的任务。\u003c/p>\n\u003ch2>首次验证\u003c/h2>\n\u003cp>在企微发送以下消息，逐步确认：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">/projects\n/new demo\n/list\n请告诉我当前终端的系统和目录，先不要修改文件。\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>demo\u003c/code> 应替换为工作目录下实际存在的项目。内置 AI 处理需要启用有效的 AI 配置；CLI 处理需要本机 CLI 安装及登录完成。\u003c/p>\n\u003cp>当手机发消息没反应时，优先查看 IM 页面的连接状态、绑定账号和执行授权，而不是仅看宠物是否在动。\u003c/p>\n"},{"title":"企业微信会话、CLI 与文件发送","file":"wecom-commands.md","text":"# 企业微信会话、CLI 与文件发送\r\n\r\n## 会话命令速查\r\n\r\n| 命令 | 用途 |\r\n| --- | --- |\r\n| `/projects [页码]` | 列出工作目录的直接子目录，每页 20 个 |\r\n| `/new [项目名或完整路径]` | 新建并聚焦终端；目录必须已存在，省略时使用工作目录 |\r\n| `/list` | 列出当前账号仍打开的桥接会话、编号、项目与状态 |\r\n| `/list 2` 或 `/sel 2` | 切到编号 2；编号以列表为准 |\r\n| `/sel 会话id` | 按完整会话 ID 切换 |\r\n| `/content` | 查看聚焦终端最近内容；快照不代表完成 |\r\n| `/claude`、`/codex`、`/codebuddy` | 在真实终端中进入相应 CLI |\r\n| `/aiquit` | 请求退出 CLI，确认回到 Shell 后恢复内置 AI 模式 |\r\n| `/permiss` | 切换一次 Claude 权限模式，并读取实际状态 |\r\n| `/stop` | 停止当前聚焦会话的任务 |\r\n| `/set_name 英文名 中文名 [昵称]` | 首次设置身份，修改时加 `--force` |\r\n| `/help` | 内置 AI 模式下查看帮助 |\r\n| `/bridge` | CLI 模式下查看桥接帮助，避免与 CLI 自己的 `/help` 冲突 |\r\n\r\n`/new` 是创建会话，不是创建文件夹。例如工作目录为 `D:\\code`，`/new demo` 对应 `D:\\code\\demo`。\r\n\r\n## 多会话如何续聊\r\n\r\n直接发送文字会续聊当前聚焦会话。引用某条桥接推送再回复，可定位到那条推送所属会话。原任务的审批和结果仍属于原会话，切换焦点不会把它迁移到其他终端。\r\n\r\n`/list` 显示当前软件进程中仍打开的桥接终端，不是全部历史清单。重启软件后不会自动恢复全部旧终端或重跑任务；旧聊天历史在对应本机历史中查看。\r\n\r\n## 进入 CLI 后的消息去向\r\n\r\n先发送 `/new demo`，再发送 `/claude`。CLI 启动后，普通消息原样送入 CLI，不再由内置 AI 先分析。CLI 使用自身的模型、登录与权限配置。\r\n\r\n若提示无法确认前台进程，消息不会被当作系统命令盲目发送。查看本机终端是否已进入 CLI，处理启动确认后再试。想回到内置 AI 时发送 `/aiquit`，等待确认退出；它不是简单切换一个界面标签。\r\n\r\n## 信任、批准与追问\r\n\r\nClaude / CodeBuddy 初次进入项目可能询问是否信任目录。企微会收到对应选择；CodeBuddy 可区分当前目录、父目录和子目录范围。按实际需要选择，不要把父目录信任当成当前项目的同义项。\r\n\r\n运行过程中出现权限卡片时，核对所属会话后点击批准或拒绝。卡片只针对当前操作，旧卡片不能批准新任务。普通 AI 审批通常 5 分钟有效；CLI 的部分权限与追问窗口为 4 分钟，以提示为准。\r\n\r\nClaude 的选择题可按卡片单选、多选、提交或自定义文本回答。多选需要提交；文本回答发到当前聚焦的待回答会话。跨会话可按提示使用 `/回答 问题编号 内容`。\r\n\r\n文件写入 / 修改授权只展示路径、操作类型、内容大小或修改数量，不再推送整份源码 JSON；其他操作仍保留用于判断的必要内容。\r\n\r\n> 如显示“已批准；卡片更新失败，本次决定已记录”，不要反复点击。批准已记录，但企微卡片外观未更新；查看终端或后续结果确认。\r\n\r\n## 进度和最终结果\r\n\r\n采用固定的“少量进度通知 + 关键节点交互 + 最终结果”。短任务一般不发送普通进度；长任务限频更新，等待审批或限流重试时暂停普通进度。终端动画、输入回显和界面重绘不会逐行转发。\r\n\r\n最终结果依赖 CLI 的完成通知，不把暂时没输出当作成功。需要临时查看原始终端时，用 `/content`。\r\n\r\n## 发送文档、图片和截图\r\n\r\n可以发送：\r\n\r\n```text\r\n生成一份项目说明，保存为 Markdown，再把文件发送到当前企业微信会话。\r\n```\r\n\r\n```text\r\n调试完成后截取网页，保存截图，再把截图文件发给我。\r\n```\r\n\r\n截图由 Agent 使用自己的工具完成；FanBox 负责将已经生成的本地文件上传并发送到当前账号。图片作为可下载文件发送。\r\n\r\n单文件最大 50 MB，不支持目录、空文件或仍在变化的文件。远端 SSH 文件先下载到本机。工具不接受任意收件人参数，只发给当前会话绑定账号。\r\n\r\n当前附件能力是**电脑向企微发送文件**，不表示支持把企微用户上传的所有附件自动下载交给 Agent。发送状态不确定时先检查企微是否已收到，不要立即重复发送。\r\n","html":"\u003ch1>企业微信会话、CLI 与文件发送\u003c/h1>\n\u003ch2>会话命令速查\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>命令\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>/projects [页码]\u003c/code>\u003c/td>\n\u003ctd>列出工作目录的直接子目录，每页 20 个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/new [项目名或完整路径]\u003c/code>\u003c/td>\n\u003ctd>新建并聚焦终端；目录必须已存在，省略时使用工作目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/list\u003c/code>\u003c/td>\n\u003ctd>列出当前账号仍打开的桥接会话、编号、项目与状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/list 2\u003c/code> 或 \u003ccode>/sel 2\u003c/code>\u003c/td>\n\u003ctd>切到编号 2；编号以列表为准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/sel 会话id\u003c/code>\u003c/td>\n\u003ctd>按完整会话 ID 切换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/content\u003c/code>\u003c/td>\n\u003ctd>查看聚焦终端最近内容；快照不代表完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/claude\u003c/code>、\u003ccode>/codex\u003c/code>、\u003ccode>/codebuddy\u003c/code>\u003c/td>\n\u003ctd>在真实终端中进入相应 CLI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/aiquit\u003c/code>\u003c/td>\n\u003ctd>请求退出 CLI，确认回到 Shell 后恢复内置 AI 模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/permiss\u003c/code>\u003c/td>\n\u003ctd>切换一次 Claude 权限模式，并读取实际状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/stop\u003c/code>\u003c/td>\n\u003ctd>停止当前聚焦会话的任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/set_name 英文名 中文名 [昵称]\u003c/code>\u003c/td>\n\u003ctd>首次设置身份，修改时加 \u003ccode>--force\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/help\u003c/code>\u003c/td>\n\u003ctd>内置 AI 模式下查看帮助\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/bridge\u003c/code>\u003c/td>\n\u003ctd>CLI 模式下查看桥接帮助，避免与 CLI 自己的 \u003ccode>/help\u003c/code> 冲突\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>/new\u003c/code> 是创建会话，不是创建文件夹。例如工作目录为 \u003ccode>D:\\code\u003c/code>，\u003ccode>/new demo\u003c/code> 对应 \u003ccode>D:\\code\\demo\u003c/code>。\u003c/p>\n\u003ch2>多会话如何续聊\u003c/h2>\n\u003cp>直接发送文字会续聊当前聚焦会话。引用某条桥接推送再回复，可定位到那条推送所属会话。原任务的审批和结果仍属于原会话，切换焦点不会把它迁移到其他终端。\u003c/p>\n\u003cp>\u003ccode>/list\u003c/code> 显示当前软件进程中仍打开的桥接终端，不是全部历史清单。重启软件后不会自动恢复全部旧终端或重跑任务；旧聊天历史在对应本机历史中查看。\u003c/p>\n\u003ch2>进入 CLI 后的消息去向\u003c/h2>\n\u003cp>先发送 \u003ccode>/new demo\u003c/code>，再发送 \u003ccode>/claude\u003c/code>。CLI 启动后，普通消息原样送入 CLI，不再由内置 AI 先分析。CLI 使用自身的模型、登录与权限配置。\u003c/p>\n\u003cp>若提示无法确认前台进程，消息不会被当作系统命令盲目发送。查看本机终端是否已进入 CLI，处理启动确认后再试。想回到内置 AI 时发送 \u003ccode>/aiquit\u003c/code>，等待确认退出；它不是简单切换一个界面标签。\u003c/p>\n\u003ch2>信任、批准与追问\u003c/h2>\n\u003cp>Claude / CodeBuddy 初次进入项目可能询问是否信任目录。企微会收到对应选择；CodeBuddy 可区分当前目录、父目录和子目录范围。按实际需要选择，不要把父目录信任当成当前项目的同义项。\u003c/p>\n\u003cp>运行过程中出现权限卡片时，核对所属会话后点击批准或拒绝。卡片只针对当前操作，旧卡片不能批准新任务。普通 AI 审批通常 5 分钟有效；CLI 的部分权限与追问窗口为 4 分钟，以提示为准。\u003c/p>\n\u003cp>Claude 的选择题可按卡片单选、多选、提交或自定义文本回答。多选需要提交；文本回答发到当前聚焦的待回答会话。跨会话可按提示使用 \u003ccode>/回答 问题编号 内容\u003c/code>。\u003c/p>\n\u003cp>文件写入 / 修改授权只展示路径、操作类型、内容大小或修改数量，不再推送整份源码 JSON；其他操作仍保留用于判断的必要内容。\u003c/p>\n\u003cblockquote>\n\u003cp>如显示“已批准；卡片更新失败，本次决定已记录”，不要反复点击。批准已记录，但企微卡片外观未更新；查看终端或后续结果确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>进度和最终结果\u003c/h2>\n\u003cp>采用固定的“少量进度通知 + 关键节点交互 + 最终结果”。短任务一般不发送普通进度；长任务限频更新，等待审批或限流重试时暂停普通进度。终端动画、输入回显和界面重绘不会逐行转发。\u003c/p>\n\u003cp>最终结果依赖 CLI 的完成通知，不把暂时没输出当作成功。需要临时查看原始终端时，用 \u003ccode>/content\u003c/code>。\u003c/p>\n\u003ch2>发送文档、图片和截图\u003c/h2>\n\u003cp>可以发送：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">生成一份项目说明，保存为 Markdown，再把文件发送到当前企业微信会话。\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-text\">调试完成后截取网页，保存截图，再把截图文件发给我。\n\u003c/code>\u003c/pre>\n\u003cp>截图由 Agent 使用自己的工具完成；FanBox 负责将已经生成的本地文件上传并发送到当前账号。图片作为可下载文件发送。\u003c/p>\n\u003cp>单文件最大 50 MB，不支持目录、空文件或仍在变化的文件。远端 SSH 文件先下载到本机。工具不接受任意收件人参数，只发给当前会话绑定账号。\u003c/p>\n\u003cp>当前附件能力是\u003cstrong>电脑向企微发送文件\u003c/strong>，不表示支持把企微用户上传的所有附件自动下载交给 Agent。发送状态不确定时先检查企微是否已收到，不要立即重复发送。\u003c/p>\n"},{"title":"Git 工作区、仓库与同步","file":"git.md","text":"# Git 工作区、仓库与同步\r\n\r\n## 添加工作区\r\n\r\n![Git 工作区入口](assets/17-git-workspaces.png)\r\n\r\n*工作区是扫描仓库的目录范围，不是 SSH 分组或企微会话。*\r\n\r\n1. 展开“Git 仓库管理”，打开“工作区”。\r\n2. 新增工作区并填写本机绝对路径。\r\n3. 保存后执行扫描。\r\n4. 打开“仓库”，查看扫描到的仓库。\r\n\r\n工作区可以设置名称和排除目录。删除工作区会移除相应管理记录，应先核对范围；日常文件删除与 Git 管理记录删除是不同操作。\r\n\r\n## 仓库操作\r\n\r\n![仓库列表](assets/18-git-repos.png)\r\n\r\n*仓库页显示可管理仓库；空列表时先添加工作区并扫描。*\r\n\r\n在仓库行或更多菜单中查看分支、同步状态、运行结果等。选择目标分支后再同步 / 切换，不要仅根据仓库名称判断当前代码分支。\r\n\r\n网络认证由本机 Git 环境决定；SSH 密钥、远程权限或 HTTP 凭据不正确时，查看具体错误并先确认本机 Git 能访问远端。\r\n\r\n## 遇到“脏工作区”\r\n\r\n脏工作区表示有未提交修改，直接切分支或更新可能覆盖 / 冲突。按目的选择：\r\n\r\n| 选择 | 适合情况 |\r\n| --- | --- |\r\n| 提交改动 | 修改已完成，希望保留为本地提交 |\r\n| Stash 暂存 | 修改未完成，想临时收起再切换 / 同步 |\r\n| 稍后处理 | 暂不改变工作区，先人工查看 |\r\n| 丢弃改动（若相应菜单提供） | 确定不再需要本地改动，执行前核对范围 |\r\n\r\n处理时留意按钮忙碌状态和进度。处理完成后刷新当前仓库状态，再执行同步；遇到冲突应检查文件和 Git 状态，不要连续重复点击。\r\n\r\nStash 是临时保存，不等于提交或推送；后续通过 Stash 管理恢复时仍可能发生冲突。\r\n\r\n## 自动同步与日志\r\n\r\n“自动同步”中创建任务，选择仓库与执行计划。与普通“定时任务”是两类入口：前者面向仓库同步 / 管理任务，后者面向 Shell 或 Agent 工作。\r\n\r\n“同步日志”用于查看每次执行的结果和错误。完成一次手动同步并确认配置有效后，再启用周期任务。\r\n","html":"\u003ch1>Git 工作区、仓库与同步\u003c/h1>\n\u003ch2>添加工作区\u003c/h2>\n\u003cp>\u003cimg src=\"assets/17-git-workspaces.png\" alt=\"Git 工作区入口\">\u003c/p>\n\u003cp>\u003cem>工作区是扫描仓库的目录范围，不是 SSH 分组或企微会话。\u003c/em>\u003c/p>\n\u003col>\n\u003cli>展开“Git 仓库管理”，打开“工作区”。\u003c/li>\n\u003cli>新增工作区并填写本机绝对路径。\u003c/li>\n\u003cli>保存后执行扫描。\u003c/li>\n\u003cli>打开“仓库”，查看扫描到的仓库。\u003c/li>\n\u003c/ol>\n\u003cp>工作区可以设置名称和排除目录。删除工作区会移除相应管理记录，应先核对范围；日常文件删除与 Git 管理记录删除是不同操作。\u003c/p>\n\u003ch2>仓库操作\u003c/h2>\n\u003cp>\u003cimg src=\"assets/18-git-repos.png\" alt=\"仓库列表\">\u003c/p>\n\u003cp>\u003cem>仓库页显示可管理仓库；空列表时先添加工作区并扫描。\u003c/em>\u003c/p>\n\u003cp>在仓库行或更多菜单中查看分支、同步状态、运行结果等。选择目标分支后再同步 / 切换，不要仅根据仓库名称判断当前代码分支。\u003c/p>\n\u003cp>网络认证由本机 Git 环境决定；SSH 密钥、远程权限或 HTTP 凭据不正确时，查看具体错误并先确认本机 Git 能访问远端。\u003c/p>\n\u003ch2>遇到“脏工作区”\u003c/h2>\n\u003cp>脏工作区表示有未提交修改，直接切分支或更新可能覆盖 / 冲突。按目的选择：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>适合情况\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>提交改动\u003c/td>\n\u003ctd>修改已完成，希望保留为本地提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stash 暂存\u003c/td>\n\u003ctd>修改未完成，想临时收起再切换 / 同步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>稍后处理\u003c/td>\n\u003ctd>暂不改变工作区，先人工查看\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>丢弃改动（若相应菜单提供）\u003c/td>\n\u003ctd>确定不再需要本地改动，执行前核对范围\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>处理时留意按钮忙碌状态和进度。处理完成后刷新当前仓库状态，再执行同步；遇到冲突应检查文件和 Git 状态，不要连续重复点击。\u003c/p>\n\u003cp>Stash 是临时保存，不等于提交或推送；后续通过 Stash 管理恢复时仍可能发生冲突。\u003c/p>\n\u003ch2>自动同步与日志\u003c/h2>\n\u003cp>“自动同步”中创建任务，选择仓库与执行计划。与普通“定时任务”是两类入口：前者面向仓库同步 / 管理任务，后者面向 Shell 或 Agent 工作。\u003c/p>\n\u003cp>“同步日志”用于查看每次执行的结果和错误。完成一次手动同步并确认配置有效后，再启用周期任务。\u003c/p>\n"},{"title":"定时任务","file":"schedules.md","text":"# 定时任务\r\n\r\n## 新建任务\r\n\r\n![定时任务创建表单](assets/19-scheduled-task.png)\r\n\r\n1. 展开左侧“定时任务”，进入“任务管理”。\r\n2. 点击“新建”。\r\n3. 在“想让它干什么”中填写工作说明；Shell 模式填写具体命令。\r\n4. 在“谁来干”中选择 Claude Code、Codex 或 Shell 命令。\r\n5. 填写实际工作目录。\r\n6. 设置一次性、周期或 Cron 等计划，填写名称并保存。\r\n\r\n例如创建一次性 Shell 检查任务，先用不会修改文件的命令验证环境。Agent 任务要求相应 CLI 已安装并能登录，内置 AI 模型配置不替代 CLI 登录。\r\n\r\n## 自动执行与运行条件\r\n\r\n“全自动：跳过所有确认”允许 Agent 直接改文件、运行命令，适用于已验证的无人值守任务；没有开启时，交互确认可能使任务等待。\r\n\r\n软件需要保持运行，电脑休眠或程序退出期间无法按时执行。界面可能提示某次计划因 FanBox 未开启而跳过，不要假定所有错过任务都会自动补跑。\r\n\r\n## 暂停、恢复和查结果\r\n\r\n页面上的“暂停全部”影响该调度器，恢复后按计划继续。单个任务可按界面提供的操作启用、停用、编辑、运行或查看记录。\r\n\r\n计划任务的运行记录可能仅表示终端启动结果，不等于 Agent 已经完成工作。暂停调度也不会中止已经开始的任务。先检查实际终端或日志，再判断任务结果、修改计划。计划任务的超时和运行限制与内置 AI 对话等待策略不一定相同，不要用“AI 命令无固定最长等待”推断所有计划任务都无限运行。\r\n","html":"\u003ch1>定时任务\u003c/h1>\n\u003ch2>新建任务\u003c/h2>\n\u003cp>\u003cimg src=\"assets/19-scheduled-task.png\" alt=\"定时任务创建表单\">\u003c/p>\n\u003col>\n\u003cli>展开左侧“定时任务”，进入“任务管理”。\u003c/li>\n\u003cli>点击“新建”。\u003c/li>\n\u003cli>在“想让它干什么”中填写工作说明；Shell 模式填写具体命令。\u003c/li>\n\u003cli>在“谁来干”中选择 Claude Code、Codex 或 Shell 命令。\u003c/li>\n\u003cli>填写实际工作目录。\u003c/li>\n\u003cli>设置一次性、周期或 Cron 等计划，填写名称并保存。\u003c/li>\n\u003c/ol>\n\u003cp>例如创建一次性 Shell 检查任务，先用不会修改文件的命令验证环境。Agent 任务要求相应 CLI 已安装并能登录，内置 AI 模型配置不替代 CLI 登录。\u003c/p>\n\u003ch2>自动执行与运行条件\u003c/h2>\n\u003cp>“全自动：跳过所有确认”允许 Agent 直接改文件、运行命令，适用于已验证的无人值守任务；没有开启时，交互确认可能使任务等待。\u003c/p>\n\u003cp>软件需要保持运行，电脑休眠或程序退出期间无法按时执行。界面可能提示某次计划因 FanBox 未开启而跳过，不要假定所有错过任务都会自动补跑。\u003c/p>\n\u003ch2>暂停、恢复和查结果\u003c/h2>\n\u003cp>页面上的“暂停全部”影响该调度器，恢复后按计划继续。单个任务可按界面提供的操作启用、停用、编辑、运行或查看记录。\u003c/p>\n\u003cp>计划任务的运行记录可能仅表示终端启动结果，不等于 Agent 已经完成工作。暂停调度也不会中止已经开始的任务。先检查实际终端或日志，再判断任务结果、修改计划。计划任务的超时和运行限制与内置 AI 对话等待策略不一定相同，不要用“AI 命令无固定最长等待”推断所有计划任务都无限运行。\u003c/p>\n"},{"title":"项目工具与进阶编辑","file":"project-tools.md","text":"# 项目工具与进阶编辑\r\n\r\n## Markdown、表格与差异\r\n\r\nMarkdown 文件提供预览 / 编辑能力，按编辑器提供的切换入口使用富文本或源码方式。保存前检查实际文件内容，尤其是包含复杂表格或特殊语法的文档。\r\n\r\nCSV / TSV 等文本表格可按支持情况以表格预览。代码与文本文件的差异查看依赖该文件的 Git 状态；在预览操作区出现差异入口时可打开对照。\r\n\r\n## 图片标注与导出\r\n\r\n打开图片后，在预览操作区选择编辑，可使用自由画笔、矩形、直线、箭头、文字和打码工具。颜色、笔画粗细和撤销位于编辑工具栏。\r\n\r\n完成后选择 PNG、JPEG 或 WebP，按需调整宽度及有损格式质量。**保存会修改目标文件；希望保留原图时使用另存为。** 编辑完成后再复制或发送图片，避免把尚未保存的画布误认为磁盘上的最新文件。\r\n\r\n## 项目记忆与内置会话历史不同\r\n\r\n在当前目录底部状态栏点击“项目记忆”，查看已发现的 Claude Code / Codex 项目会话日志、涉及文件和使用记录。展开记录可查看关联文件；点击文件进入相应位置。\r\n\r\n“续上”会在终端启动对应 CLI 的历史恢复命令，不是把 CLI 历史导入内置 AI。当前版本的 Claude 恢复入口带跳过权限参数；希望使用默认审批时，手工在 CLI 中恢复会话。\r\n\r\n没有发现记录时页面会显示空状态。删除或迁移外部 CLI 日志会影响可见历史，FanBox 不保证能恢复所有外部工具的旧对话。\r\n\r\n## 占用透视\r\n\r\n从目录底部“占用透视”或文件夹右键菜单打开，查看包括子目录在内的磁盘占用。点击目录行可以下钻，适合定位缓存、构建产物或大文件。\r\n\r\n大目录扫描可能需要时间，文件权限和扫描口径会影响结果。先定位实际路径，再使用文件管理操作处理；不要仅因为文件大就删除依赖或工作文件。\r\n\r\n## AI 整理目录\r\n\r\n目录菜单中提供 AI 整理入口时，可把当前目录交给已安装的 Agent 讨论整理方案。软件会准备目录约定和历史资料，并在终端启动对话。\r\n\r\n先核对待移动文件与目标位置，再让 Agent 执行；整理可能影响脚本路径、引用和工程结构。撤销需结合整理日志与实际文件状态处理，不要把所有文件移动都当作可无条件恢复。\r\n\r\n## 发版向导\r\n\r\n检测到项目时，底部状态栏可能显示“发版”。打开后核对当前版本、目标版本和发布说明，并选择界面提供的打包、推送或 Release 选项。\r\n\r\n点击“在终端开跑”后，操作序列在终端执行。当前工作区未提交改动可能一并进入发版提交，务必先检查变更范围。构建命令由项目自身脚本决定，不保证所有项目都会生成 Windows exe；不要照搬其他平台的打包脚本。\r\n\r\n推送与发布会影响远端仓库，先确认分支、远端地址和权限。某一步失败时根据终端输出处理，不要因界面已关闭就认定发布完成。\r\n","html":"\u003ch1>项目工具与进阶编辑\u003c/h1>\n\u003ch2>Markdown、表格与差异\u003c/h2>\n\u003cp>Markdown 文件提供预览 / 编辑能力，按编辑器提供的切换入口使用富文本或源码方式。保存前检查实际文件内容，尤其是包含复杂表格或特殊语法的文档。\u003c/p>\n\u003cp>CSV / TSV 等文本表格可按支持情况以表格预览。代码与文本文件的差异查看依赖该文件的 Git 状态；在预览操作区出现差异入口时可打开对照。\u003c/p>\n\u003ch2>图片标注与导出\u003c/h2>\n\u003cp>打开图片后，在预览操作区选择编辑，可使用自由画笔、矩形、直线、箭头、文字和打码工具。颜色、笔画粗细和撤销位于编辑工具栏。\u003c/p>\n\u003cp>完成后选择 PNG、JPEG 或 WebP，按需调整宽度及有损格式质量。\u003cstrong>保存会修改目标文件；希望保留原图时使用另存为。\u003c/strong> 编辑完成后再复制或发送图片，避免把尚未保存的画布误认为磁盘上的最新文件。\u003c/p>\n\u003ch2>项目记忆与内置会话历史不同\u003c/h2>\n\u003cp>在当前目录底部状态栏点击“项目记忆”，查看已发现的 Claude Code / Codex 项目会话日志、涉及文件和使用记录。展开记录可查看关联文件；点击文件进入相应位置。\u003c/p>\n\u003cp>“续上”会在终端启动对应 CLI 的历史恢复命令，不是把 CLI 历史导入内置 AI。当前版本的 Claude 恢复入口带跳过权限参数；希望使用默认审批时，手工在 CLI 中恢复会话。\u003c/p>\n\u003cp>没有发现记录时页面会显示空状态。删除或迁移外部 CLI 日志会影响可见历史，FanBox 不保证能恢复所有外部工具的旧对话。\u003c/p>\n\u003ch2>占用透视\u003c/h2>\n\u003cp>从目录底部“占用透视”或文件夹右键菜单打开，查看包括子目录在内的磁盘占用。点击目录行可以下钻，适合定位缓存、构建产物或大文件。\u003c/p>\n\u003cp>大目录扫描可能需要时间，文件权限和扫描口径会影响结果。先定位实际路径，再使用文件管理操作处理；不要仅因为文件大就删除依赖或工作文件。\u003c/p>\n\u003ch2>AI 整理目录\u003c/h2>\n\u003cp>目录菜单中提供 AI 整理入口时，可把当前目录交给已安装的 Agent 讨论整理方案。软件会准备目录约定和历史资料，并在终端启动对话。\u003c/p>\n\u003cp>先核对待移动文件与目标位置，再让 Agent 执行；整理可能影响脚本路径、引用和工程结构。撤销需结合整理日志与实际文件状态处理，不要把所有文件移动都当作可无条件恢复。\u003c/p>\n\u003ch2>发版向导\u003c/h2>\n\u003cp>检测到项目时，底部状态栏可能显示“发版”。打开后核对当前版本、目标版本和发布说明，并选择界面提供的打包、推送或 Release 选项。\u003c/p>\n\u003cp>点击“在终端开跑”后，操作序列在终端执行。当前工作区未提交改动可能一并进入发版提交，务必先检查变更范围。构建命令由项目自身脚本决定，不保证所有项目都会生成 Windows exe；不要照搬其他平台的打包脚本。\u003c/p>\n\u003cp>推送与发布会影响远端仓库，先确认分支、远端地址和权限。某一步失败时根据终端输出处理，不要因界面已关闭就认定发布完成。\u003c/p>\n"},{"title":"主题、桌面宠物与辅助视图","file":"appearance.md","text":"# 主题、桌面宠物与辅助视图\r\n\r\n## 主题与背景\r\n\r\n![主题配置窗口](assets/16-themes.png)\r\n\r\n打开“视图”中的主题配置，选择主题及深色 / 浅色 / 跟随系统模式。编辑器配色可跟随主题，也可单独选择。\r\n\r\n支持导入主题 JSON、新建自定义主题，以及设置背景图片、不透明度和模糊程度。Windows Mica 是系统背景效果，与所选背景图片的透明度和模糊并非同一个选项；是否可用取决于当前系统环境。\r\n\r\n## 桌面宠物\r\n\r\n![宠物设置与扩展动作](assets/15-pet-settings.png)\r\n\r\n*设置面板显示连接状态、动画开关、造型、皮肤和动作；真实机器人连接状态以 IM 页面为准。*\r\n\r\n- 软件最小化后宠物仍浮动在桌面。\r\n- 单击宠物显示主窗口；右键打开宠物设置。\r\n- 拖动宠物改变位置，使用“重置位置”恢复。\r\n- 隐藏后可从 IM 设置中的宠物入口重新显示。\r\n- 默认有小猫、小狗、狐狸、机器人，提供原色、奶油、夜空、薄荷等皮肤。\r\n\r\n在线时表现活跃，离线时默认睡眠；等待审批或任务处理中也有不同提示。宠物动画不是网络连通性检测的替代品，不能因为它没动就判断机器人离线。\r\n\r\n## 动画开关与播放\r\n\r\n勾选“启用动画”，选择动作，点击“播放动作”。鼠标移入宠物会触发选定动作。\r\n\r\n新版中，手动播放不受机器人在线状态和 Windows“减少动态效果”限制。Windows 要求减少动态效果时，自动互动会减少 / 停止，但你仍可主动点击播放。关闭宠物自身“启用动画”后，所有动作不播放，并提示重新开启。\r\n\r\n动作播放中不要频繁切换造型或皮肤；这些操作会重建宠物并中止当前动作。\r\n\r\n## 扩展皮肤和动作\r\n\r\n- 动作：JSON 格式，最多 32 KB，最多保存 20 个；可下载内置动作示例作为模板。\r\n- 皮肤：配色 JSON 或 PNG / WebP 图片，图片不超过 256 KB、512×512，最多保存 8 个自定义皮肤。\r\n- 导入成功后在下拉框选择；删除操作只针对自定义项。\r\n- 自定义动作通过位置、旋转、缩放关键帧表现，不是任意脚本或 3D 动捕加载器。\r\n\r\n动作和皮肤是两个扩展入口：换皮肤改变外观，换动作改变运动。详细字段可参考项目附带的 `docs/pet-actions` 示例。\r\n\r\n## Skills 透视和 Agent 用量\r\n\r\n左侧“Skills 透视”用于查看本机发现的技能情况；“Agent 用量”用于查看已支持 Agent 的用量信息。数据依赖本机安装、日志和可访问的账户信息，缺失不能当作使用量为零。\r\n\r\n“Agent 项目”用于快速回到被 Agent 使用的项目；与 AI 对话历史不是同一个列表。\r\n","html":"\u003ch1>主题、桌面宠物与辅助视图\u003c/h1>\n\u003ch2>主题与背景\u003c/h2>\n\u003cp>\u003cimg src=\"assets/16-themes.png\" alt=\"主题配置窗口\">\u003c/p>\n\u003cp>打开“视图”中的主题配置，选择主题及深色 / 浅色 / 跟随系统模式。编辑器配色可跟随主题，也可单独选择。\u003c/p>\n\u003cp>支持导入主题 JSON、新建自定义主题，以及设置背景图片、不透明度和模糊程度。Windows Mica 是系统背景效果，与所选背景图片的透明度和模糊并非同一个选项；是否可用取决于当前系统环境。\u003c/p>\n\u003ch2>桌面宠物\u003c/h2>\n\u003cp>\u003cimg src=\"assets/15-pet-settings.png\" alt=\"宠物设置与扩展动作\">\u003c/p>\n\u003cp>\u003cem>设置面板显示连接状态、动画开关、造型、皮肤和动作；真实机器人连接状态以 IM 页面为准。\u003c/em>\u003c/p>\n\u003cul>\n\u003cli>软件最小化后宠物仍浮动在桌面。\u003c/li>\n\u003cli>单击宠物显示主窗口；右键打开宠物设置。\u003c/li>\n\u003cli>拖动宠物改变位置，使用“重置位置”恢复。\u003c/li>\n\u003cli>隐藏后可从 IM 设置中的宠物入口重新显示。\u003c/li>\n\u003cli>默认有小猫、小狗、狐狸、机器人，提供原色、奶油、夜空、薄荷等皮肤。\u003c/li>\n\u003c/ul>\n\u003cp>在线时表现活跃，离线时默认睡眠；等待审批或任务处理中也有不同提示。宠物动画不是网络连通性检测的替代品，不能因为它没动就判断机器人离线。\u003c/p>\n\u003ch2>动画开关与播放\u003c/h2>\n\u003cp>勾选“启用动画”，选择动作，点击“播放动作”。鼠标移入宠物会触发选定动作。\u003c/p>\n\u003cp>新版中，手动播放不受机器人在线状态和 Windows“减少动态效果”限制。Windows 要求减少动态效果时，自动互动会减少 / 停止，但你仍可主动点击播放。关闭宠物自身“启用动画”后，所有动作不播放，并提示重新开启。\u003c/p>\n\u003cp>动作播放中不要频繁切换造型或皮肤；这些操作会重建宠物并中止当前动作。\u003c/p>\n\u003ch2>扩展皮肤和动作\u003c/h2>\n\u003cul>\n\u003cli>动作：JSON 格式，最多 32 KB，最多保存 20 个；可下载内置动作示例作为模板。\u003c/li>\n\u003cli>皮肤：配色 JSON 或 PNG / WebP 图片，图片不超过 256 KB、512×512，最多保存 8 个自定义皮肤。\u003c/li>\n\u003cli>导入成功后在下拉框选择；删除操作只针对自定义项。\u003c/li>\n\u003cli>自定义动作通过位置、旋转、缩放关键帧表现，不是任意脚本或 3D 动捕加载器。\u003c/li>\n\u003c/ul>\n\u003cp>动作和皮肤是两个扩展入口：换皮肤改变外观，换动作改变运动。详细字段可参考项目附带的 \u003ccode>docs/pet-actions\u003c/code> 示例。\u003c/p>\n\u003ch2>Skills 透视和 Agent 用量\u003c/h2>\n\u003cp>左侧“Skills 透视”用于查看本机发现的技能情况；“Agent 用量”用于查看已支持 Agent 的用量信息。数据依赖本机安装、日志和可访问的账户信息，缺失不能当作使用量为零。\u003c/p>\n\u003cp>“Agent 项目”用于快速回到被 Agent 使用的项目；与 AI 对话历史不是同一个列表。\u003c/p>\n"},{"title":"数据、备份与快捷操作","file":"data-and-shortcuts.md","text":"# 数据、备份与快捷操作\r\n\r\n## 数据保存在哪里\r\n\r\n默认业务配置目录为 Windows 用户主目录下的 `.fanbox-pro-win`，例如 `%USERPROFILE%\\.fanbox-pro-win`。配置了 `GITSYNC_HOME` 时，业务配置位置会随之变化。\r\n\r\n| 内容 | 保存范围 |\r\n| --- | --- |\r\n| SSH / AI / IM 等业务设置 | 业务配置目录；具体设置保存在相应配置文件中 |\r\n| AI 聊天历史 | `ai-conversations` 子目录 |\r\n| 执行审批审计 | `shell-ai-audit.jsonl`，不含命令正文和原始输出 |\r\n| 主题、宠物等界面偏好 | 应用本地浏览器存储 |\r\n| 桌面宠物位置 | Electron 用户数据目录 |\r\n| 项目代码、文档、下载文件 | 原来的文件目录，不会因聊天记录删除而删除 |\r\n\r\n密钥和记住的凭据使用系统加密。把配置复制到另一 Windows 用户或另一电脑后，密文可能无法解密，需要重新输入凭据或扫码；仅有配置备份不保证密钥能跨机器恢复。\r\n\r\n## 备份和迁移建议\r\n\r\n1. 保存编辑内容，停止任务并退出程序。\r\n2. 备份项目文件和业务配置目录。\r\n3. 如需保留外观等偏好，同时备份对应 Electron 用户数据目录；实际位置以当前安装环境为准。\r\n4. 在目标电脑安装 CLI、Git 等外部工具并重新登录。\r\n5. 恢复配置后逐项测试 SSH、模型和企微连接；无法解密的凭据重新配置。\r\n\r\n聊天历史不能恢复已经结束的终端进程。不要用直接编辑历史 JSON 的方式恢复执行授权。\r\n\r\n## 常用快捷键与入口\r\n\r\n| 操作 | 快捷键 / 入口 |\r\n| --- | --- |\r\n| 文件搜索 | Ctrl+K |\r\n| 搜索范围切换 | 搜索框内 Tab |\r\n| 文件重命名 | 文件区域 F2 |\r\n| 保存文本 / 代码 | 编辑器 Ctrl+S |\r\n| AI 发送消息 | Enter |\r\n| AI 输入换行 | Shift+Enter |\r\n| 中断终端前台任务 | Ctrl+C，实际行为由前台程序决定 |\r\n| Claude 权限模式循环 | Shift+Tab，或支持的权限图标 / 企微 `/permiss` |\r\n| 查看会话历史 | 当前 AI 会话顶部“会话历史” |\r\n| 弹窗取消 | 取消 / 关闭；支持的弹窗可按 Escape |\r\n\r\n快捷键具有焦点范围：编辑器、终端、搜索框中的相同按键可能有不同含义。中文输入候选状态下先完成选词。\r\n\r\n## 信息会发到哪里\r\n\r\n内置 AI 将你的消息及获准的上下文发送给已配置模型服务；执行工具得到的结果也用于后续分析。企微桥接发送消息和所选附件给当前绑定账号。CLI 使用自身的服务配置。\r\n\r\n“本地文件浏览”与“调用在线 AI / 企业微信”应区别理解：不要把界面上的本地运行说明理解成所有功能都完全离线。\r\n","html":"\u003ch1>数据、备份与快捷操作\u003c/h1>\n\u003ch2>数据保存在哪里\u003c/h2>\n\u003cp>默认业务配置目录为 Windows 用户主目录下的 \u003ccode>.fanbox-pro-win\u003c/code>，例如 \u003ccode>%USERPROFILE%\\.fanbox-pro-win\u003c/code>。配置了 \u003ccode>GITSYNC_HOME\u003c/code> 时，业务配置位置会随之变化。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>保存范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SSH / AI / IM 等业务设置\u003c/td>\n\u003ctd>业务配置目录；具体设置保存在相应配置文件中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 聊天历史\u003c/td>\n\u003ctd>\u003ccode>ai-conversations\u003c/code> 子目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>执行审批审计\u003c/td>\n\u003ctd>\u003ccode>shell-ai-audit.jsonl\u003c/code>，不含命令正文和原始输出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主题、宠物等界面偏好\u003c/td>\n\u003ctd>应用本地浏览器存储\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>桌面宠物位置\u003c/td>\n\u003ctd>Electron 用户数据目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目代码、文档、下载文件\u003c/td>\n\u003ctd>原来的文件目录，不会因聊天记录删除而删除\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>密钥和记住的凭据使用系统加密。把配置复制到另一 Windows 用户或另一电脑后，密文可能无法解密，需要重新输入凭据或扫码；仅有配置备份不保证密钥能跨机器恢复。\u003c/p>\n\u003ch2>备份和迁移建议\u003c/h2>\n\u003col>\n\u003cli>保存编辑内容，停止任务并退出程序。\u003c/li>\n\u003cli>备份项目文件和业务配置目录。\u003c/li>\n\u003cli>如需保留外观等偏好，同时备份对应 Electron 用户数据目录；实际位置以当前安装环境为准。\u003c/li>\n\u003cli>在目标电脑安装 CLI、Git 等外部工具并重新登录。\u003c/li>\n\u003cli>恢复配置后逐项测试 SSH、模型和企微连接；无法解密的凭据重新配置。\u003c/li>\n\u003c/ol>\n\u003cp>聊天历史不能恢复已经结束的终端进程。不要用直接编辑历史 JSON 的方式恢复执行授权。\u003c/p>\n\u003ch2>常用快捷键与入口\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>快捷键 / 入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>文件搜索\u003c/td>\n\u003ctd>Ctrl+K\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>搜索范围切换\u003c/td>\n\u003ctd>搜索框内 Tab\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文件重命名\u003c/td>\n\u003ctd>文件区域 F2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存文本 / 代码\u003c/td>\n\u003ctd>编辑器 Ctrl+S\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 发送消息\u003c/td>\n\u003ctd>Enter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 输入换行\u003c/td>\n\u003ctd>Shift+Enter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中断终端前台任务\u003c/td>\n\u003ctd>Ctrl+C，实际行为由前台程序决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Claude 权限模式循环\u003c/td>\n\u003ctd>Shift+Tab，或支持的权限图标 / 企微 \u003ccode>/permiss\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查看会话历史\u003c/td>\n\u003ctd>当前 AI 会话顶部“会话历史”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>弹窗取消\u003c/td>\n\u003ctd>取消 / 关闭；支持的弹窗可按 Escape\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>快捷键具有焦点范围：编辑器、终端、搜索框中的相同按键可能有不同含义。中文输入候选状态下先完成选词。\u003c/p>\n\u003ch2>信息会发到哪里\u003c/h2>\n\u003cp>内置 AI 将你的消息及获准的上下文发送给已配置模型服务；执行工具得到的结果也用于后续分析。企微桥接发送消息和所选附件给当前绑定账号。CLI 使用自身的服务配置。\u003c/p>\n\u003cp>“本地文件浏览”与“调用在线 AI / 企业微信”应区别理解：不要把界面上的本地运行说明理解成所有功能都完全离线。\u003c/p>\n"},{"title":"常见问题与排查","file":"troubleshooting.md","text":"# 常见问题与排查\r\n\r\n## AI 配置与聊天\r\n\r\n| 现象 | 先检查 | 下一步 |\r\n| --- | --- | --- |\r\n| 获取模型失败 | HTTP / HTTPS、主机、端口、路径、网络 | 使用服务实际地址；再用“检测”验证具体模型 |\r\n| HTTP 401 / 403 | 密钥、账户权限、网关认证方式 | 重新填写对应密钥，确认该模型可用 |\r\n| fetch failed / 模型连接失败 | 地址协议、证书、网络可达性 | 查看新版具体错误；不要把 HTTP 服务误配成 HTTPS |\r\n| 模型检测成功，但不执行命令 | 交互开关、权限模式、工具调用支持 | 开启交互并选择确认模式，发送明确执行任务 |\r\n| 目标系统未识别 | 是否还在登录菜单 / 堡垒机选择界面 | 先人工进入 Shell，再让 AI 识别；必要时确认实际系统 |\r\n| 模型长时间无响应后中断 | 是否连续 5 分钟无新数据 | 检查模型服务；继续前核对已执行命令 |\r\n| 继续任务却像重新开始 | 是否换了终端 / 新对话 / 旧版本 | 使用新版，在原会话继续；重述最新目标与已完成事项 |\r\n| 命令没有结束 | 是否常驻程序或等待交互 | 查看终端，接管或停止，不要重复启动 |\r\n\r\n## SSH\r\n\r\n`All configured authentication methods failed` 通常与认证相关。先检查用户名、密码 / 私钥和服务器允许的方法。密码留空时应在终端等待输入；密码错误后应重新输入，不要在聊天输入框发送密码。\r\n\r\n齐治终端显示 `Please re-login` 时，优先核对终端类型 `xterm`、系统探测选项以及堡垒机要求的登录流程。先保证人工 Shell 能稳定登录，再启用 AI。\r\n\r\n远程文件打不开而 Shell 可用时，检查 SFTP 权限和堡垒机文件传输能力。\r\n\r\n## 企业微信\r\n\r\n1. 在 IM 设置检查是否启用、是否连接、有无错误。\r\n2. 检查发消息的账号是否已绑定。\r\n3. 检查“允许已绑定账号操作终端”是否开启。\r\n4. 用 `/list` 核对当前会话；切换到正确项目。\r\n5. 内置 AI 检查启用模型；CLI 检查终端是否已经启动、登录或等待确认。\r\n\r\n“凭据无法解密”：重新扫码或填写 Secret；AI 密钥也可能需要重新填写。不要把秘密值发到问题反馈中。\r\n\r\n“已批准；卡片更新失败”：决定已记录，只是卡片状态更新失败。等待执行结果或查看终端，不要重复批准旧卡片。\r\n\r\n“无法确认终端前台进程”：查看本机终端是否仍在启动 / 信任提示 / 登录界面，处理后重试。消息被拦截是为了避免 CLI 退出后把普通文本作为 Shell 命令输入。\r\n\r\n## 宠物\r\n\r\n机器人能发消息但宠物不动，不代表机器人离线。检查宠物“启用动画”；新版手动播放不受 Windows 减少动态效果限制。若仍看到旧版“当前离线或已关闭动画”提示，退出旧实例并启动新版本。\r\n\r\n主窗口最小化后宠物应继续显示；如果被隐藏，从 IM 设置恢复。单击桌面宠物可唤出软件。\r\n\r\n## 文件与界面\r\n\r\nHTML 空白：先确认文件能被浏览器打开，检查外部资源、相对路径和是否必须启动开发服务器。不要将所有 HTML 都当作无需服务的静态页面。\r\n\r\n文件保存失败：检查路径权限、只读状态以及外部文件修改。远端文件冲突先比较版本。\r\n\r\n终端中文无法输入：先确认焦点在终端、输入法正常，候选词选定后再提交；使用最新版本的输入法兼容修复。\r\n\r\n## 反馈时提供什么\r\n\r\n提供版本、出问题的入口、操作顺序、完整错误文字、发生时间，以及不包含密钥的截图。说明是本地终端还是 SSH、内置 AI 还是 CLI、滚轮滚动还是调整终端尺寸。不要上传密码、Secret、API 密钥或完整私钥。\r\n","html":"\u003ch1>常见问题与排查\u003c/h1>\n\u003ch2>AI 配置与聊天\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>获取模型失败\u003c/td>\n\u003ctd>HTTP / HTTPS、主机、端口、路径、网络\u003c/td>\n\u003ctd>使用服务实际地址；再用“检测”验证具体模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP 401 / 403\u003c/td>\n\u003ctd>密钥、账户权限、网关认证方式\u003c/td>\n\u003ctd>重新填写对应密钥，确认该模型可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fetch failed / 模型连接失败\u003c/td>\n\u003ctd>地址协议、证书、网络可达性\u003c/td>\n\u003ctd>查看新版具体错误；不要把 HTTP 服务误配成 HTTPS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型检测成功，但不执行命令\u003c/td>\n\u003ctd>交互开关、权限模式、工具调用支持\u003c/td>\n\u003ctd>开启交互并选择确认模式，发送明确执行任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标系统未识别\u003c/td>\n\u003ctd>是否还在登录菜单 / 堡垒机选择界面\u003c/td>\n\u003ctd>先人工进入 Shell，再让 AI 识别；必要时确认实际系统\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型长时间无响应后中断\u003c/td>\n\u003ctd>是否连续 5 分钟无新数据\u003c/td>\n\u003ctd>检查模型服务；继续前核对已执行命令\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续任务却像重新开始\u003c/td>\n\u003ctd>是否换了终端 / 新对话 / 旧版本\u003c/td>\n\u003ctd>使用新版，在原会话继续；重述最新目标与已完成事项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>命令没有结束\u003c/td>\n\u003ctd>是否常驻程序或等待交互\u003c/td>\n\u003ctd>查看终端，接管或停止，不要重复启动\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>SSH\u003c/h2>\n\u003cp>\u003ccode>All configured authentication methods failed\u003c/code> 通常与认证相关。先检查用户名、密码 / 私钥和服务器允许的方法。密码留空时应在终端等待输入；密码错误后应重新输入，不要在聊天输入框发送密码。\u003c/p>\n\u003cp>齐治终端显示 \u003ccode>Please re-login\u003c/code> 时，优先核对终端类型 \u003ccode>xterm\u003c/code>、系统探测选项以及堡垒机要求的登录流程。先保证人工 Shell 能稳定登录，再启用 AI。\u003c/p>\n\u003cp>远程文件打不开而 Shell 可用时，检查 SFTP 权限和堡垒机文件传输能力。\u003c/p>\n\u003ch2>企业微信\u003c/h2>\n\u003col>\n\u003cli>在 IM 设置检查是否启用、是否连接、有无错误。\u003c/li>\n\u003cli>检查发消息的账号是否已绑定。\u003c/li>\n\u003cli>检查“允许已绑定账号操作终端”是否开启。\u003c/li>\n\u003cli>用 \u003ccode>/list\u003c/code> 核对当前会话；切换到正确项目。\u003c/li>\n\u003cli>内置 AI 检查启用模型；CLI 检查终端是否已经启动、登录或等待确认。\u003c/li>\n\u003c/ol>\n\u003cp>“凭据无法解密”：重新扫码或填写 Secret；AI 密钥也可能需要重新填写。不要把秘密值发到问题反馈中。\u003c/p>\n\u003cp>“已批准；卡片更新失败”：决定已记录，只是卡片状态更新失败。等待执行结果或查看终端，不要重复批准旧卡片。\u003c/p>\n\u003cp>“无法确认终端前台进程”：查看本机终端是否仍在启动 / 信任提示 / 登录界面，处理后重试。消息被拦截是为了避免 CLI 退出后把普通文本作为 Shell 命令输入。\u003c/p>\n\u003ch2>宠物\u003c/h2>\n\u003cp>机器人能发消息但宠物不动，不代表机器人离线。检查宠物“启用动画”；新版手动播放不受 Windows 减少动态效果限制。若仍看到旧版“当前离线或已关闭动画”提示，退出旧实例并启动新版本。\u003c/p>\n\u003cp>主窗口最小化后宠物应继续显示；如果被隐藏，从 IM 设置恢复。单击桌面宠物可唤出软件。\u003c/p>\n\u003ch2>文件与界面\u003c/h2>\n\u003cp>HTML 空白：先确认文件能被浏览器打开，检查外部资源、相对路径和是否必须启动开发服务器。不要将所有 HTML 都当作无需服务的静态页面。\u003c/p>\n\u003cp>文件保存失败：检查路径权限、只读状态以及外部文件修改。远端文件冲突先比较版本。\u003c/p>\n\u003cp>终端中文无法输入：先确认焦点在终端、输入法正常，候选词选定后再提交；使用最新版本的输入法兼容修复。\u003c/p>\n\u003ch2>反馈时提供什么\u003c/h2>\n\u003cp>提供版本、出问题的入口、操作顺序、完整错误文字、发生时间，以及不包含密钥的截图。说明是本地终端还是 SSH、内置 AI 还是 CLI、滚轮滚动还是调整终端尺寸。不要上传密码、Secret、API 密钥或完整私钥。\u003c/p>\n"},{"title":"文档阅读、导入与维护","file":"publishing.md","text":"# 文档阅读、导入与维护\r\n\r\n本指南提供 GitBook 可用的 Markdown 目录、`SUMMARY.md` 导航、`.gitbook.yaml` 配置及相对路径截图。无需启动 FanBox 即可阅读。\r\n\r\n## 本地阅读\r\n\r\n打开同目录 `index.html` 查看带侧栏导航的离线阅读版。保留 `assets` 文件夹和 HTML 的相对位置；直接分享时建议发送整个 ZIP 包。\r\n\r\nMarkdown 编辑器可以直接打开 `README.md`，通过章节链接阅读。截图都保存在 `assets` 中，不依赖外部图床。\r\n\r\n## 导入 GitBook\r\n\r\n通过 Git Sync 把此目录映射为一个文档空间，内容目录使用 `docs/user-guide`；如果将本指南单独放到文档仓库根目录，则使用该根目录。保留 `.gitbook.yaml`、`README.md` 和 `SUMMARY.md`。\r\n\r\n现有 GitBook 站点请沿用它自己的空间映射，不要盲目覆盖全站配置。本交付仅生成可导入文件，没有替你创建或发布线上站点。\r\n\r\nGitBook 的导航和内容配置依据：[官方内容配置文档](https://gitbook.com/docs/docs-as-code/git-sync/content-configuration)。\r\n\r\n## 截图来源与更新\r\n\r\n截图于 2026-10-20 从当前 Windows 应用生成，采用独立用户目录、本机模拟模型和示例项目。AI 对话中的模型回复为明确标记的演示内容；命令授权图使用真实弹窗组件展示，没有执行该命令。\r\n\r\n没有创建真实企微机器人、发送真实消息或连接生产服务器；因此企微手机端和 SFTP 没有伪造的操作截图，相关章节通过步骤和命令示例说明。\r\n\r\n维护时更新对应章节及截图，再检查 `SUMMARY.md` 和图片相对链接。源码仓库中的 `scripts/capture-user-guide.js` 可重新生成演示截图；它使用测试端口和独立配置，不应与相同端口的测试同时运行。\r\n","html":"\u003ch1>文档阅读、导入与维护\u003c/h1>\n\u003cp>本指南提供 GitBook 可用的 Markdown 目录、\u003ccode>SUMMARY.md\u003c/code> 导航、\u003ccode>.gitbook.yaml\u003c/code> 配置及相对路径截图。无需启动 FanBox 即可阅读。\u003c/p>\n\u003ch2>本地阅读\u003c/h2>\n\u003cp>打开同目录 \u003ccode>index.html\u003c/code> 查看带侧栏导航的离线阅读版。保留 \u003ccode>assets\u003c/code> 文件夹和 HTML 的相对位置；直接分享时建议发送整个 ZIP 包。\u003c/p>\n\u003cp>Markdown 编辑器可以直接打开 \u003ccode>README.md\u003c/code>，通过章节链接阅读。截图都保存在 \u003ccode>assets\u003c/code> 中，不依赖外部图床。\u003c/p>\n\u003ch2>导入 GitBook\u003c/h2>\n\u003cp>通过 Git Sync 把此目录映射为一个文档空间，内容目录使用 \u003ccode>docs/user-guide\u003c/code>；如果将本指南单独放到文档仓库根目录，则使用该根目录。保留 \u003ccode>.gitbook.yaml\u003c/code>、\u003ccode>README.md\u003c/code> 和 \u003ccode>SUMMARY.md\u003c/code>。\u003c/p>\n\u003cp>现有 GitBook 站点请沿用它自己的空间映射，不要盲目覆盖全站配置。本交付仅生成可导入文件，没有替你创建或发布线上站点。\u003c/p>\n\u003cp>GitBook 的导航和内容配置依据：\u003ca href=\"https://gitbook.com/docs/docs-as-code/git-sync/content-configuration\">官方内容配置文档\u003c/a>。\u003c/p>\n\u003ch2>截图来源与更新\u003c/h2>\n\u003cp>截图于 2026-10-20 从当前 Windows 应用生成，采用独立用户目录、本机模拟模型和示例项目。AI 对话中的模型回复为明确标记的演示内容；命令授权图使用真实弹窗组件展示，没有执行该命令。\u003c/p>\n\u003cp>没有创建真实企微机器人、发送真实消息或连接生产服务器；因此企微手机端和 SFTP 没有伪造的操作截图，相关章节通过步骤和命令示例说明。\u003c/p>\n\u003cp>维护时更新对应章节及截图，再检查 \u003ccode>SUMMARY.md\u003c/code> 和图片相对链接。源码仓库中的 \u003ccode>scripts/capture-user-guide.js\u003c/code> 可重新生成演示截图；它使用测试端口和独立配置，不应与相同端口的测试同时运行。\u003c/p>\n"}];let selected=0;
const nav=document.querySelector('nav');
function navigation(){const q=document.querySelector('#search').value.toLowerCase();nav.replaceChildren();pages.forEach((p,i)=>{if(q&&!p.text.toLowerCase().includes(q))return;const a=document.createElement('a');a.href='#'+p.file;a.textContent=p.title;a.classList.toggle('active',i===selected);nav.append(a);});}
function show(){const file=decodeURIComponent(location.hash.slice(1))||'README.md';selected=Math.max(0,pages.findIndex(p=>p.file===file));const p=pages[selected];document.querySelector('article').innerHTML=p.html;document.querySelector('#current').textContent=p.title;document.title=p.title+' · fanbox-pro 用户指南';document.querySelector('.pager').innerHTML=[selected>0?'<a href="#'+pages[selected-1].file+'">← '+pages[selected-1].title+'</a>':'<span></span>',selected<pages.length-1?'<a href="#'+pages[selected+1].file+'">'+pages[selected+1].title+' →</a>':''].join('');navigation();scrollTo(0,0);}
document.querySelector('#search').oninput=navigation;onhashchange=show;
document.querySelector('article').onclick=e=>{const image=e.target.closest('img');if(image){document.querySelector('#zoom img').src=image.src;document.querySelector('#zoom').showModal();return;}const a=e.target.closest('a');if(a&&a.getAttribute('href')?.endsWith('.md')){e.preventDefault();if(a.getAttribute('href')==='SUMMARY.md'){document.querySelector('#search').focus();return;}location.hash=a.getAttribute('href');}};
document.querySelector('#zoom button').onclick=()=>document.querySelector('#zoom').close();document.querySelector('#zoom img').onclick=()=>document.querySelector('#zoom').close();show();
</script></body></html>
